name: Apply final compact status strip and physician emails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="rotastic-final-compact-status-strip"' in s:
              print('Patch already applied; no changes needed.')
              raise SystemExit(0)
          for anchor in ['id="rotasticLiveMini"','id="driveTimeBtn"','id="weatherBadge"','onclick="openSwapRequestModal()"','onclick="toggleRotaExportMenu()"','function getKnownPhysicianEmail(docName)','function renderPhysicianManagement()']:
              assert anchor in s, anchor
          old="""  const permanentDirectory = {
    'Dr Zaid SE.': 'zeleish@phcc.gov.qa',
    'Dr Mohamed M.': 'mmoursi@phcc.gov.qa',
    'Dr Nabina': 'fnabina@phcc.gov.qa',
    'Dr. Nabina': 'fnabina@phcc.gov.qa'
  };"""
          new="""  const permanentDirectory = {
    'Dr Mohamed M.': 'mmoursi@phcc.gov.qa',
    'Dr Husam S': 'halsaudi@phcc.gov.qa',
    'Dr Fazila K.': 'fkhattak@phcc.gov.qa',
    'Dr Mohammed S.': 'msayed@phcc.gov.qa',
    'Dr Bilal C.': 'bchaudhry@phcc.gov.qa',
    'Dr Saima N.': 'snaz@phcc.gov.qa',
    'Dr Imran A.': 'imahmad@phcc.gov.qa',
    'Dr Maher A.': 'mahed@phcc.gov.qa',
    'Dr Laith A.': 'lalmarsomi@phcc.gov.qa',
    'Dr Oula T.': 'otayar@phcc.gov.qa',
    'Dr Abdulgafoor K.': 'akuniyil@phcc.gov.qa',
    'Dr Abdulrashid S.': 'asiddique@phcc.gov.qa',
    'Dr Shadi T': 'saltarawneh@phcc.gov.qa',
    'Dr Syed I.': 'sislam@phcc.gov.qa',
    'Dr Selman E.': 'serturhan@phcc.gov.qa',
    'Dr Enan M.': 'emasoud@phcc.gov.qa',
    'Dr Gani M.': 'gsmohamed@phcc.gov.qa',
    'Dr Faisal C.': 'fchaudhry@phcc.gov.qa',
    'Dr Muhammad K.': 'mkhattak@phcc.gov.qa',
    'Dr Aminullah Z.': 'azamani@phcc.gov.qa',
    'Dr Salah M.': 'salmohammed@phcc.gov.qa',
    'Dr Rida C.': 'rchandio@phcc.gov.qa',
    'Dr Maya S.': 'msukkari@phcc.gov.qa',
    'Dr Laila A.': 'layoub@phcc.gov.qa',
    'Dr Saba T.': 'satahir@phcc.gov.qa',
    'Dr Tayseer A.': 'tayed@phcc.gov.qa',
    'Dr Zaid SE.': 'zeleish@phcc.gov.qa',
    'Dr Nabina': 'fnabina@phcc.gov.qa',
    'Dr. Nabina': 'fnabina@phcc.gov.qa'
  };"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          oldr="""    const safe = doc.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\"/g,'&quot;');
    const encodedName = encodeURIComponent(doc.name);"""
          newr="""    const safe = doc.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\"/g,'&quot;');
    const physicianEmail = getKnownPhysicianEmail(doc.name);
    const safeEmail = String(physicianEmail || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\"/g,'&quot;');
    const encodedName = encodeURIComponent(doc.name);"""
          assert s.count(oldr)==1
          s=s.replace(oldr,newr,1)
          n='<div class="text-xs font-bold text-white">${safe}</div>'
          assert s.count(n)==1
          s=s.replace(n,n+"\n          ${safeEmail ? `<div class=\"text-[9px] text-cyan-300/80 break-all mt-0.5\">${safeEmail}</div>` : ''}",1)
          css='''\n<style id="rotastic-final-compact-status-strip">\n.live-rota-meta-row{grid-template-columns:auto minmax(0,1fr) auto!important;gap:6px!important;align-items:center!important}\n.live-rota-meta-row>div:first-child,.live-rota-meta-row .rotastic-live-mini,.live-drive-slot,#weatherBadge{min-height:20px!important;height:20px!important;padding:0 2px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}\n.live-drive-slot{display:flex!important;align-items:center!important;justify-content:center!important}\n.live-drive-slot #driveTimeBtn{display:inline-flex!important;width:auto!important;min-width:0!important;max-width:none!important;min-height:20px!important;height:20px!important;padding:0 2px!important;gap:4px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;align-items:center!important;justify-content:center!important}\n#liveRotaUpdatedAt,#driveTimeBtnSub{display:none!important}\n.rotastic-live-mini-label,#driveTimeBtnText,#weatherTemp{font-size:10px!important;line-height:1!important;font-weight:700!important}\n.rotastic-live-mini-label{color:#f43f5e!important}\n#weatherBadge{width:auto!important;min-width:0!important;justify-content:flex-end!important}\n@media(max-width:640px){.live-rota-meta-row>div:first-child,.live-rota-meta-row .rotastic-live-mini,.live-drive-slot,#weatherBadge,.live-drive-slot #driveTimeBtn{min-height:20px!important;height:20px!important;padding-top:0!important;padding-bottom:0!important}#driveTimeBtnText,#weatherTemp,.rotastic-live-mini-label{font-size:10px!important}}\n</style>\n'''
          i=s.rfind('</body>'); assert i!=-1
          s=s[:i]+css+s[i:]
          emails=['mmoursi@phcc.gov.qa','halsaudi@phcc.gov.qa','fkhattak@phcc.gov.qa','msayed@phcc.gov.qa','bchaudhry@phcc.gov.qa','snaz@phcc.gov.qa','imahmad@phcc.gov.qa','mahed@phcc.gov.qa','lalmarsomi@phcc.gov.qa','otayar@phcc.gov.qa','akuniyil@phcc.gov.qa','asiddique@phcc.gov.qa','saltarawneh@phcc.gov.qa','sislam@phcc.gov.qa','serturhan@phcc.gov.qa','emasoud@phcc.gov.qa','gsmohamed@phcc.gov.qa','fchaudhry@phcc.gov.qa','mkhattak@phcc.gov.qa','azamani@phcc.gov.qa','salmohammed@phcc.gov.qa','rchandio@phcc.gov.qa','msukkari@phcc.gov.qa','layoub@phcc.gov.qa','satahir@phcc.gov.qa','tayed@phcc.gov.qa','zeleish@phcc.gov.qa','fnabina@phcc.gov.qa']
          assert all(e in s for e in emails)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit index if changed
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix compact status strip and add physician emails"
          git pull --rebase origin main
          git push origin main
