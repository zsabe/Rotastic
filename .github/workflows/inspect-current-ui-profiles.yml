name: Inspect live Pages and physician profiles
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['ROTASTIC_FULL_DOCTOR_NAMES','physicianDirectory','renderPhysician','doctor profile','profile','mailto:','email','ROTASTIC_COMPACT_DOCTOR_NAMES']
          for term in terms:
              print(f'\n===== {term} =====')
              start=0; shown=0
              while shown<12:
                  i=s.lower().find(term.lower(),start)
                  if i<0: break
                  a=max(0,i-650); b=min(len(s),i+1400)
                  print(s[a:b].replace('\r',''))
                  print('\n---')
                  start=i+len(term); shown+=1
              if shown==0: print('NOT FOUND')
          PY
