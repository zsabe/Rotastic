name: Patch access code Outlook flow

on:
  push:
    paths:
      - '.github/workflows/patch-access-code-outlook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict access-code patch
        run: |
          python .github/scripts/patch_access_code_outlook.py
          git diff --check
          git diff --stat
      - name: Commit runtime patch
        run: |
          git config user.name 'ROTASTIC maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix access-code physician email and Outlook draft'
          git push origin HEAD:main
