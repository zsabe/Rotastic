name: Clean temporary announcement tooling
on:
  push:
    paths:
      - '.github/workflows/cleanup-announcement-temp.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary diagnostic and patch files
        run: |
          rm -f .github/announcement-snippets.txt
          rm -f .github/target-*.txt
          rm -f .github/scripts/apply_announcement_scope_patch.py
          rm -f .github/workflows/inspect-announcements.yml
          rm -f .github/workflows/capture-announcement-snippets.yml
          rm -f .github/workflows/capture-targeted-announcements.yml
          rm -f .github/workflows/apply-announcement-scope-patch.yml
          rm -f .github/workflows/cleanup-announcement-temp.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github
          git commit -m 'Remove temporary announcement tooling'
          git push