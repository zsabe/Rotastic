name: Apply requested main rota amendment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply requested three-box rota amendment') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only requested main-screen controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          old_meta='''<div class="live-rota-meta-row w-full">
          <button class="rotastic-top-export-card" id="topExportCard" onclick="toggleRotaExportMenu()" type="button" aria-label="Export rota">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
          <span>Export</span>
          <i class="fa-solid fa-chevron-down rotastic-top-export-chevron"></i>
          </button>
          <div class="live-drive-slot">
          <a aria-label="Open Google Maps driving directions to Abu Nakhla Health Centre" class="hidden inline-flex items-center justify-center gap-2 max-w-[58%] px-2.5 py-1.5 rounded-lg border border-sky-500/20 bg-sky-500/5 text-[9px] font-extrabold text-sky-300 hover:bg-sky-500/10 transition" href="https://www.google.com/maps/dir/?api=1&amp;destination=25.18239%2C51.37947&amp;travelmode=driving&amp;dir_action=navigate" id="driveTimeBtn" rel="noopener" target="_blank" title="Open Google Maps driving directions to Abu Nakhla Health Centre">
          <i class="fa-solid fa-location-arrow text-[14px] opacity-90"></i>
          <span class="drive-time-copy">
          <span class="truncate" id="driveTimeBtnText">ETA --</span>
          <span class="truncate" id="driveTimeBtnSub">to Abu Nakhla</span>
          </span>
          </a>
          </div>
          <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-slate-900/60 border border-slate-800 text-[9px] font-semibold text-slate-300 h-[24px] flex-shrink-0" id="weatherBadge">
          <span id="weatherEmoji">🌤️</span>
          <span id="weatherTemp">Weather</span>
          <span class="hidden sm:inline text-slate-500 max-w-[55px] truncate" id="weatherCondition"></span>
          </span>
          </div>
          </div>'''.replace('          ','')
          if s.count(old_meta)!=1:
              raise SystemExit(f'Expected exactly one original ETA/weather box row, found {s.count(old_meta)}')
          s=s.replace(old_meta,'',1)

          old_refresh='''<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-[11px] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" onclick="refreshLiveRota()" type="button">
          <i class="fa-solid fa-rotate text-[12px]"></i><span>Refresh</span>
          </button>'''.replace('          ','')
          new_export='''<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-[11px] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" onclick="toggleRotaExportMenu()" type="button">
          <i class="fa-solid fa-arrow-up-from-bracket text-[12px]"></i><span>Export</span><i class="fa-solid fa-chevron-down text-[8px] text-slate-500"></i>
          </button>'''.replace('          ','')
          if s.count(old_refresh)!=1:
              raise SystemExit(f'Expected exactly one Refresh action button, found {s.count(old_refresh)}')
          s=s.replace(old_refresh,new_export,1)

          old_live='''<div class="rotastic-live-mini" id="rotasticLiveMini">
          <span class="relative flex h-1.5 w-1.5 flex-shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>
            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>
          </span>
          <span class="rotastic-live-mini-label">LIVE</span>
          <button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>
          </div>'''.replace('          ','')
          new_live='''<div class="rotastic-live-mini" id="rotasticLiveMini">
          <span class="relative flex h-1.5 w-1.5 flex-shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>
            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>
          </span>
          <span class="rotastic-live-mini-label">LIVE</span>
          <div class="live-drive-slot">
          <a aria-label="Open Google Maps driving directions to Abu Nakhla Health Centre" class="hidden inline-flex items-center justify-center gap-2 max-w-[58%] px-2.5 py-1.5 rounded-lg border border-sky-500/20 bg-sky-500/5 text-[9px] font-extrabold text-sky-300 hover:bg-sky-500/10 transition" href="https://www.google.com/maps/dir/?api=1&amp;destination=25.18239%2C51.37947&amp;travelmode=driving&amp;dir_action=navigate" id="driveTimeBtn" rel="noopener" target="_blank" title="Open Google Maps driving directions to Abu Nakhla Health Centre">
          <i class="fa-solid fa-location-arrow text-[14px] opacity-90"></i>
          <span class="drive-time-copy">
          <span class="truncate" id="driveTimeBtnText">ETA --</span>
          <span class="truncate" id="driveTimeBtnSub">to Abu Nakhla</span>
          </span>
          </a>
          </div>
          <button class="inline-flex items-center gap-1 text-slate-300 flex-shrink-0" id="weatherBadge" onclick="updateAbuNakhlaWeather()" title="Refresh Abu Nakhla weather" type="button">
          <span id="weatherEmoji">🌤️</span>
          <span id="weatherTemp">Weather</span>
          <span class="hidden sm:inline text-slate-500 max-w-[55px] truncate" id="weatherCondition"></span>
          </button>
          <button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>
          </div>'''.replace('          ','')
          if s.count(old_live)!=1:
              raise SystemExit(f'Expected exactly one original LIVE strip, found {s.count(old_live)}')
          s=s.replace(old_live,new_live,1)

          css_anchor=".rotastic-live-mini button{min-height:18px!important;padding:0!important;background:none!important;border:0!important;color:#64748b!important;font-size:8px!important;line-height:1!important}"
          css_add=css_anchor+'''\n/* Requested compact ETA + Weather beside LIVE; scoped to this strip only. */
.rotastic-live-mini .live-drive-slot{width:auto!important;min-width:0!important;height:20px!important;min-height:20px!important;display:flex!important;align-items:center!important;overflow:visible!important}
.rotastic-live-mini .live-drive-slot #driveTimeBtn{display:inline-flex!important;width:auto!important;min-width:0!important;max-width:none!important;height:20px!important;min-height:20px!important;max-height:20px!important;margin:0!important;padding:0 5px!important;border:0!important;border-radius:6px!important;background:transparent!important;box-shadow:none!important;gap:3px!important}
.rotastic-live-mini .live-drive-slot #driveTimeBtn>i{font-size:9px!important}
.rotastic-live-mini #driveTimeBtnText{font-size:8px!important;line-height:1!important;color:#7dd3fc!important;font-weight:900!important}
.rotastic-live-mini #driveTimeBtnSub{display:none!important}
.rotastic-live-mini #weatherBadge{display:inline-flex!important;width:auto!important;min-width:0!important;max-width:none!important;height:20px!important;min-height:20px!important;max-height:20px!important;margin:0!important;padding:0 5px!important;border:0!important;border-radius:6px!important;background:transparent!important;box-shadow:none!important;gap:3px!important;color:#cbd5e1!important;font-size:8px!important;font-weight:850!important}
.rotastic-live-mini #weatherTemp{font-size:8px!important;font-weight:850!important;color:#cbd5e1!important}
'''
          if s.count(css_anchor)!=1:
              raise SystemExit(f'Expected one LIVE strip CSS anchor, found {s.count(css_anchor)}')
          s=s.replace(css_anchor,css_add,1)

          if s==original:
              raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only requested UI changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q 'id="rotasticLiveMini"' index.html
          grep -q 'id="driveTimeBtn"' index.html
          grep -q 'id="weatherBadge"' index.html
          grep -q '<span>Rota View</span>' index.html
          grep -q '<span>Request Swap</span>' index.html
          grep -q '<span>Export</span>' index.html
          test "$(grep -c '<span>Refresh</span>' index.html || true)" = "0"
          test "$(grep -c 'id="driveTimeBtn"' index.html)" = "1"
          test "$(grep -c 'id="weatherBadge"' index.html)" = "1"
          test "$(grep -c 'personal-poster-card' index.html)" -gt "0"
      - name: Commit amendment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply requested three-box rota amendment'
          git push
