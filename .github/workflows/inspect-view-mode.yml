name: Inspect view mode code
on:
  push:
    paths:
      - '.github/workflows/inspect-view-mode.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show view mode block safely
        shell: bash
        run: |
          sed -n '9440,9735p' index.html | sed -E 's/[0-9]{5,6}/[redacted]/g'
