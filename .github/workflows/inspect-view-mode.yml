name: Apply view mode fix

on:
  push:
    paths:
      - '.github/workflows/inspect-view-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch view switch and layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat1=r"\n  if \(rotasticIsPermanentAdminIdentity\(\)\) \{.*?\n  \}\n\n  // Every non-permanent account must present an admin-issued code when\n  // moving from Colleague View into Admin View\. A delegated grant alone\n  // never bypasses this challenge\.\n  openAdminModal\(\);"
          rep1="\n  // Every account must present an Admin View code when moving from\n  // Colleague View back into Admin View. Permanent admin PINs are verified\n  // by verifyAdminPasskey(); temporary issued codes continue through the\n  // secure backend redemption path.\n  openAdminModal();"
          if 'Every account must present an Admin View code when moving from' not in s:
              s,n=re.subn(pat1,rep1,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('view badge block not found')
          pat2=r"\n  // Verified permanent admins never need to re-enter an Admin View code\..*?\n  document\.getElementById\('adminModal'\)\.classList\.remove\('hidden'\);"
          rep2="\n  // Returning from Colleague View always requires the code challenge,\n  // including verified permanent admin accounts.\n  document.getElementById('adminModal').classList.remove('hidden');"
          if 'Returning from Colleague View always requires the code challenge' not in s:
              s,n=re.subn(pat2,rep2,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('admin modal block not found')
          p.write_text(s,encoding='utf-8')
          q=Path('admin-comms-ui.js')
          j=q.read_text(encoding='utf-8')
          old='.rac-view-holder{margin-top:10px;max-width:100%}'
          new='.rac-view-holder{margin-top:10px;max-width:100%;display:flex;align-items:center;gap:8px;overflow-x:auto}.rac-view-holder>button,.rac-view-holder>a,.rac-view-holder>[role=button]{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;width:auto!important;max-width:100%!important;white-space:nowrap!important;padding-left:14px!important;padding-right:14px!important}.rac-view-holder #adminBadgeText{white-space:nowrap!important;display:inline!important}'
          if old in j: j=j.replace(old,new,1)
          elif 'white-space:nowrap!important' not in j: raise SystemExit('view holder css not found')
          q.write_text(j,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          git diff --check
          grep -q 'Every account must present an Admin View code' index.html
          grep -q 'Returning from Colleague View always requires the code challenge' index.html
          grep -q 'white-space:nowrap!important' admin-comms-ui.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-comms-ui.js
          git commit -m 'Fix Admin View return challenge and switch layout'
          git push origin HEAD:main
