name: Inject design-safe admin center

on:
  push:
    paths:
      - '.github/workflows/inject-admin-center-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inject admin center loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_ids = ['rotastic-admin-workflow-loader','rotastic-admin-comms-loader']
          import re
          for old_id in old_ids:
              s = re.sub(r'\s*<script[^>]*id=["\']'+re.escape(old_id)+r'["\'][^>]*></script>\s*', '\n', s, flags=re.I)
          tag = '<script id="rotastic-admin-center-loader" src="./admin-comms-ui.js?v=20261026-4" defer></script>'
          if 'rotastic-admin-center-loader' not in s:
              m = re.search(r'</body>', s, re.I)
              if not m:
                  raise SystemExit('No closing body tag found')
              i = m.start()
              s = s[:i] + tag + '\n' + s[i:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          git diff --check
          grep -q 'rotastic-admin-center-loader' index.html
          ! grep -q 'rotastic-admin-workflow-loader' index.html
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load design-safe admin center directly'
          git push origin HEAD:main
