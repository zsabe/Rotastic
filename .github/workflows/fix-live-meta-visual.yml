name: Fix LIVE ETA Weather visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-meta-visual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unwanted ETA and weather rectangles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          marker='</head>'
          css='''\n<style id="rotastic-live-meta-plain-fix">\n/* Requested visual correction only: ETA and Weather remain clickable, without card-like rectangles. */\n.live-rota-meta-row #driveTimeBtn{\n  background:transparent!important;\n  border-color:transparent!important;\n  box-shadow:none!important;\n  border-radius:0!important;\n  padding-left:4px!important;\n  padding-right:4px!important;\n}\n.live-rota-meta-row #weatherBadge{\n  background:transparent!important;\n  border-color:transparent!important;\n  box-shadow:none!important;\n  border-radius:0!important;\n  padding-left:4px!important;\n  padding-right:4px!important;\n}\n.live-rota-meta-row{background:transparent!important;border:0!important;box-shadow:none!important;}\n</style>\n'''
          if 'id="rotastic-live-meta-plain-fix"' not in text:
              if marker not in text: raise SystemExit('head marker missing')
              text=text.replace(marker,css+marker,1)
          p.write_text(text)
          PY
          git diff --check
          grep -q 'rotastic-live-meta-plain-fix' index.html
          grep -q 'id="topActionGrid"' index.html
          grep -q 'id="tickerContent"' index.html
          grep -q 'You are off today' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/fix-live-meta-visual.yml
          git commit -m 'Remove ETA and weather card outlines' || exit 0
          git push
