name: Lock approved rota generation
on:
  push:
    paths:
      - '.github/workflows/lock-approved-rota-generation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch approved rota generation lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor="""function setRotaApprovalWorkflow(workflow) {\n  Storage.setJSON('rotastic_rota_approval_workflow', workflow || {});\n}\n"""
          insert="""function setRotaApprovalWorkflow(workflow) {\n  Storage.setJSON('rotastic_rota_approval_workflow', workflow || {});\n}\n\nlet rotasticGenerationLockCache = {locked:false, unlock_at:null, week_start:null, status:null};\n\nfunction rotasticNextWednesday2200After(iso) {\n  if (!iso) return null;\n  const d = new Date(iso);\n  if (Number.isNaN(d.getTime())) return null;\n  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Qatar',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);\n  const m={}; parts.forEach(function(x){ if(x.type!=='literal') m[x.type]=x.value; });\n  const base = new Date(Date.UTC(Number(m.year), Number(m.month)-1, Number(m.day), 19, 0, 0));\n  const dow = base.getUTCDay();\n  let days = (3 - dow + 7) % 7;\n  if (days === 0) days = 7;\n  base.setUTCDate(base.getUTCDate() + days);\n  return base.toISOString();\n}\n\nfunction rotasticLocalGenerationLock() {\n  const workflow = getRotaApprovalWorkflow();\n  if (!workflow || !workflow.approvedAt || workflow.status !== 'approved') return {locked:false};\n  const unlock = rotasticNextWednesday2200After(workflow.approvedAt);\n  return {\n    locked: !!(unlock && Date.now() < new Date(unlock).getTime()),\n    unlock_at: unlock,\n    week_start: workflow.snapshot?.weekStart || '',\n    status: workflow.status\n  };\n}\n\nfunction rotasticGenerationLockInfo() {\n  const local = rotasticLocalGenerationLock();\n  if (local.locked) return local;\n  return rotasticGenerationLockCache || {locked:false};\n}\n\nfunction rotasticFormatGenerationUnlock(iso) {\n  if (!iso) return 'Wednesday at 22:00 Qatar time';\n  try {\n    return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Qatar',weekday:'long',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)) + ' Qatar time';\n  } catch(e) { return 'Wednesday at 22:00 Qatar time'; }\n}\n\nfunction rotasticRenderGenerationLock() {\n  const info = rotasticGenerationLockInfo();\n  const btn = document.querySelector('button[onclick="generateDutyScheduleFromPlanner()"]');\n  if (!btn) return;\n  btn.disabled = !!info.locked;\n  btn.classList.toggle('opacity-50', !!info.locked);\n  btn.classList.toggle('cursor-not-allowed', !!info.locked);\n  btn.title = info.locked ? ('Approved rota locked until ' + rotasticFormatGenerationUnlock(info.unlock_at) + '. Use Smart Amendment for changes.') : '';\n}\n\nasync function rotasticRefreshGenerationLock() {\n  try {\n    if (rotasticBackendClient && rotasticBackendReady) {\n      const result = await rotasticBackendClient.rpc('rotastic_rota_generation_lock_status');\n      if (!result.error && result.data) rotasticGenerationLockCache = result.data;\n    }\n  } catch(e) { console.warn('ROTASTIC generation lock check:', e); }\n  rotasticRenderGenerationLock();\n  return rotasticGenerationLockInfo();\n}\n\nfunction rotasticGuardNewGeneration(showAlert) {\n  const info = rotasticGenerationLockInfo();\n  if (!info.locked) return true;\n  if (showAlert !== false) {\n    alert('This approved rota is locked. A new rota cannot be generated until ' + rotasticFormatGenerationUnlock(info.unlock_at) + '. Use the Smart Amendment box for changes to the current rota.');\n  }\n  return false;\n}\n"""
          if 'let rotasticGenerationLockCache' not in s:
              if anchor not in s: raise SystemExit('workflow anchor missing')
              s=s.replace(anchor,insert,1)

          old="function generateDutyScheduleFromPlanner() {\n  const weekSelect = document.getElementById('cycleStartDate');"
          new="async function generateDutyScheduleFromPlanner() {\n  await rotasticRefreshGenerationLock();\n  if (!rotasticGuardNewGeneration(true)) return false;\n  const weekSelect = document.getElementById('cycleStartDate');"
          if old in s: s=s.replace(old,new,1)
          elif 'async function generateDutyScheduleFromPlanner()' not in s: raise SystemExit('planner generator anchor missing')

          old="function generateDutySchedule() {\n  const configuredShiftLeadAM"
          new="function generateDutySchedule() {\n  if (!window.__rotasticSmartAmendmentApplying && !rotasticGuardNewGeneration(true)) return false;\n  const configuredShiftLeadAM"
          if old in s: s=s.replace(old,new,1)
          elif '__rotasticSmartAmendmentApplying' not in s: raise SystemExit('core generator anchor missing')

          old="async function generateAutomaticWeeklyDraftIfDue() {\n  const due = getMostRecentWednesday2200Qatar();"
          new="async function generateAutomaticWeeklyDraftIfDue() {\n  await rotasticRefreshGenerationLock();\n  if (!rotasticGuardNewGeneration(false)) { renderAutoGenerationStatus(); return false; }\n  const due = getMostRecentWednesday2200Qatar();"
          if old in s: s=s.replace(old,new,1)
          elif 'await rotasticRefreshGenerationLock();' not in s[s.find('async function generateAutomaticWeeklyDraftIfDue()'):s.find('async function generateAutomaticWeeklyDraftIfDue()')+300]: raise SystemExit('auto generator anchor missing')

          approval="""  workflow.releasedToAllAt = workflow.approvedAt;\n  workflow.releasedToAllBy = 'Dr Mohamed M.';\n  setRotaApprovalWorkflow(workflow);\n"""
          approval_new="""  workflow.releasedToAllAt = workflow.approvedAt;\n  workflow.releasedToAllBy = 'Dr Mohamed M.';\n  setRotaApprovalWorkflow(workflow);\n  rotasticGenerationLockCache = {locked:true, unlock_at:rotasticNextWednesday2200After(workflow.approvedAt), week_start:workflow.snapshot?.weekStart || '', status:'approved'};\n  rotasticRenderGenerationLock();\n"""
          if approval in s: s=s.replace(approval,approval_new,1)
          elif 'rotasticGenerationLockCache = {locked:true' not in s: raise SystemExit('approval anchor missing')

          amend_tail="""  renderScheduleView();\n  renderSmartRotaRules();\n  renderPhysicianManagement();\n  renderRotaApprovalWorkflow();\n}\n\nfunction cancelScheduleAmendment()"""
          amend_new="""  const approvedWorkflow = getRotaApprovalWorkflow();\n  if (approvedWorkflow && approvedWorkflow.status === 'approved' && approvedWorkflow.approvedAt) {\n    approvedWorkflow.lastSmartAmendmentAt = new Date().toISOString();\n    approvedWorkflow.lastSmartAmendmentText = action.raw || describeScheduleAmendment(action);\n    setRotaApprovalWorkflow(approvedWorkflow);\n    window.__rotasticSmartAmendmentApplying = true;\n    setTimeout(function(){\n      Promise.resolve(rotasticBackendPersistRotaDocument('approved')).finally(function(){ window.__rotasticSmartAmendmentApplying = false; });\n    },0);\n  }\n\n  renderScheduleView();\n  renderSmartRotaRules();\n  renderPhysicianManagement();\n  renderRotaApprovalWorkflow();\n  rotasticRenderGenerationLock();\n}\n\nfunction cancelScheduleAmendment()"""
          if amend_tail in s: s=s.replace(amend_tail,amend_new,1)
          elif 'lastSmartAmendmentAt' not in s: raise SystemExit('smart amendment anchor missing')

          tab_anchor="else if (tab === 'generator' && adminMode) { renderPhysicianManagement(); initializeAutoRotaRuleSettings(); renderSmartRotaRules(); renderRotaApprovalWorkflow(); renderScheduleAmendmentAssistantAccess(); }"
          tab_new="else if (tab === 'generator' && adminMode) { renderPhysicianManagement(); initializeAutoRotaRuleSettings(); renderSmartRotaRules(); renderRotaApprovalWorkflow(); renderScheduleAmendmentAssistantAccess(); rotasticRefreshGenerationLock(); }"
          if tab_anchor in s: s=s.replace(tab_anchor,tab_new,1)

          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          import re
          w=re.sub(r"const CACHE = '[^']+';", "const CACHE = 'rotastic-v231-approved-rota-lock';", w, count=1)
          sw.write_text(w,encoding='utf-8')
          PY
          rm -f .github/workflows/lock-approved-rota-generation.yml
      - name: Commit lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js .github/workflows/lock-approved-rota-generation.yml
          git commit -m 'Lock approved rota generation until Wednesday'
          git push
