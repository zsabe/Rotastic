name: Fix live row and poster size

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Restore LIVE ETA Weather row and enlarge poster') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested visual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the previous runtime DOM-moving patch completely, wherever it was inserted.
          s=re.sub(r'\n*<!-- rotastic-live-inline-tools-patch: only ETA/Weather/Refresh placement -->.*?<script id="rotastic-live-inline-tools-patch">.*?</script>\n*', '\n', s, flags=re.S)

          marker='rotastic-live-row-poster-v1'
          if marker not in s:
              css='''\n<style id="rotastic-live-row-poster-v1">\n/* Requested minor amendments only: restore original LIVE | ETA | Weather row and slightly deepen personal poster. */\n.live-rota-meta-row{\n  display:grid !important;\n  grid-template-columns:auto minmax(82px,1fr) auto !important;\n  align-items:center !important;\n  gap:6px !important;\n  visibility:visible !important;\n  opacity:1 !important;\n}\n.live-rota-meta-row > *{visibility:visible !important;opacity:1 !important;}\n.live-drive-slot{display:flex !important;justify-content:center !important;align-items:center !important;min-width:0 !important;}\n#driveTimeBtn,#weatherBadge{display:inline-flex !important;visibility:visible !important;opacity:1 !important;}\n#driveTimeBtn{height:24px !important;min-height:24px !important;max-height:24px !important;width:auto !important;min-width:58px !important;padding:0 8px !important;margin:0 !important;}\n#weatherBadge{height:24px !important;min-height:24px !important;max-height:24px !important;width:auto !important;padding:0 7px !important;margin:0 !important;}\n.personal-poster-card,.personal-poster-content{min-height:430px !important;}\n@media(max-width:520px){\n  .live-rota-meta-row{grid-template-columns:auto minmax(82px,1fr) auto !important;gap:5px !important;}\n  .personal-poster-card,.personal-poster-content{min-height:430px !important;}\n}\n</style>\n'''
              # Insert before the actual final body close, not any embedded export-template string.
              pos=s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('No final </body> found; refusing change')
              s=s[:pos]+css+s[pos:]

          # Guardrails: original features must remain present.
          required=['live-rota-meta-row','driveTimeBtn','weatherBadge','personal-poster-card','topActionGrid','scheduleMatrixContainer']
          for item in required:
              if item not in s:
                  raise SystemExit('Missing required original anchor: '+item)
          if 'rotastic-live-inline-tools-patch' in s:
              raise SystemExit('Old DOM-moving patch still present')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit exact visual fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore LIVE ETA Weather row and enlarge poster"
          git push
