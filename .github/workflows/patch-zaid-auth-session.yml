name: Install secure ROTASTIC code manager

on:
  push:
    paths:
      - '.github/workflows/patch-zaid-auth-session.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install secure code manager loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./rotastic-code-fix.js?v=20261029-3"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('body closing tag not found; aborting safely')
              s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'rotastic-code-fix.js?v=20261029-3' index.html
          test -f rotastic-code-fix.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load secure Dr Zaid code manager from app'
          git push origin HEAD:main
