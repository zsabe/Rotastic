name: Inspect admin card anchors

on:
  push:
    paths:
      - '.github/workflows/inspect-admin-card.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact email mapping fragments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          for needle in ['function getKnownPhysicianEmail', 'Dr Mohamed M.', 'mmoursi@phcc.gov.qa']:
              print('\n' + '='*25 + f' {needle} ' + '='*25)
              start = 0
              hits = 0
              while True:
                  i = s.find(needle, start)
                  if i < 0: break
                  hits += 1
                  print(s[max(0,i-1800):min(len(s),i+3600)])
                  print('\n--- HIT END ---')
                  start = i + len(needle)
                  if hits >= 6: break
              if not hits: print('NOT FOUND')
          PY
