name: Inspect ROTASTIC day total

on:
  push:
    paths:
      - '.github/workflows/inspect-day-total.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant code
        run: |
          echo '--- Day total text ---'
          grep -n -i -C 8 'day total' index.html || true
          echo '--- getDayDisplayedLeaveCount ---'
          grep -n -C 12 'getDayDisplayedLeaveCount' index.html || true
          echo '--- getShiftLeaveCount ---'
          grep -n -C 12 'getShiftLeaveCount' index.html || true
          echo '--- onLeaveCount ---'
          grep -n -C 8 'onLeaveCount' index.html || true
