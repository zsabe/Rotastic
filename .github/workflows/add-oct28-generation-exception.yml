name: Add Oct 28 generation exception safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-oct28-generation-exception.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add one-off automatic generation guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          target='async function generateAutomaticWeeklyDraftIfDue() {'
          if target not in s:
              raise SystemExit('automatic generation function not found')
          insert="""async function generateAutomaticWeeklyDraftIfDue() {\n  try {\n    const qatarToday = typeof getQatarTodayISO === 'function' ? getQatarTodayISO() : '';\n    if (qatarToday === '2026-10-28') {\n      const status = document.getElementById('autoGenerationStatus');\n      if (status) status.textContent = 'Manual exception: no automatic rota generation on Wednesday 28 Oct 2026. Normal weekly generation resumes next Wednesday.';\n      return false;\n    }\n  } catch (e) {}\n"""
          s=s.replace(target,insert,1)
          required=['id="tickerContent"','You are off today','id="topActionGrid"','id="notificationBellBtn"','id="scheduleMatrixContainer"']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('baseline anchor missing: '+', '.join(missing))
          p.write_text(s)
          PY
          git diff --check
          grep -q "2026-10-28" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-oct28-generation-exception.yml
          git commit -m 'Add Oct 28 automatic generation exception only'
          git push
