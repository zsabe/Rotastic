name: Inspect original amendment targets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'Write exact original amendment targets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['live-rota-meta-row','driveTimeBtn','weatherBadge','topActionGrid','Refresh','Rota View','Request Swap','topExportBtn','personal-poster-card']
          out=[]
          for n in needles:
              positions=[]; start=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  positions.append(i); start=i+1
              out.append(f'\n===== {n} count={len(positions)} =====\n')
              for k,i in enumerate(positions[:5],1):
                  a=max(0,i-900); b=min(len(s),i+1800)
                  out.append(f'--- occurrence {k} at {i} ---\n{s[a:b]}\n')
          Path('original-amendment-targets.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original-amendment-targets.txt
          git commit -m "Write exact original amendment targets"
          git push
