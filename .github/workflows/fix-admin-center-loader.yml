name: Fix admin center loader placement

on:
  push:
    paths:
      - '.github/workflows/fix-admin-center-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Place loader at real document end
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]*id=["\']rotastic-admin-center-loader["\'][^>]*></script>\s*','\n',s,flags=re.I)
          tag='<script id="rotastic-admin-center-loader" src="./admin-comms-ui.js?v=20261026-5" defer></script>'
          i=s.lower().rfind('</body>')
          if i < 0:
              raise SystemExit('No final closing body tag found')
          s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          git diff --check
          test "$(grep -o 'rotastic-admin-center-loader' index.html | wc -l)" -eq 1
          tail -n 12 index.html | grep -q 'rotastic-admin-center-loader'
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Place admin center loader at document end'
          git push origin HEAD:main
