name: Load ROTASTIC logout UI

on:
  push:
    paths:
      - 'logout-ui.js'
      - '.github/workflows/load-logout-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add logout UI script and refresh cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="logout-ui.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Could not find closing body tag')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          if sw.exists():
              w=sw.read_text(encoding='utf-8')
              import re
              w2=re.sub(r"const CACHE = '([^']+)';",lambda m: "const CACHE = 'rotastic-v236-logout-switch-account';",w,count=1)
              if w2!=w: sw.write_text(w2,encoding='utf-8')
          PY
          node --check logout-ui.js
          grep -q 'logout-ui.js' index.html
          git diff --check
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Load logout and switch-account control'
          git push origin HEAD:main
