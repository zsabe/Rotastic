name: Capture announcement snippets
on:
  push:
    paths:
      - '.github/workflows/capture-announcement-snippets.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant announcement sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          src=p.read_text(errors='ignore')
          keys=('announcement','prayer','adhan','diabetes','obesity','ticker','medical','cpd','salah','fajr','dhuhr','asr','maghrib','isha')
          out=[f'bytes={len(src)} lines={src.count(chr(10))+1}']
          seen=[]
          low=src.lower()
          for key in keys:
              start=0
              count=0
              while True:
                  i=low.find(key,start)
                  if i<0: break
                  if all(abs(i-j)>900 for j in seen):
                      seen.append(i); count+=1
                      a=max(0,i-1200); b=min(len(src),i+2500)
                      out.append(f'\n===== KEY={key} POS={i} =====\n'+src[a:b])
                  start=i+len(key)
                  if count>=8: break
          if len(out)==1:
              out.append('\nFIRST_4000\n'+src[:4000])
          Path('.github/announcement-snippets.txt').write_text('\n'.join(out))
          PY
      - name: Commit snippet file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/announcement-snippets.txt
          git commit -m 'Refresh temporary announcement snippets'
          git push