name: Restore original splash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-first-splash.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove forced splash suppression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          block='''<style id="rotastic-second-splash-removal">\n#rotasticOpeningSplash { display: none !important; visibility: hidden !important; pointer-events: none !important; }\n</style>\n'''
          if block not in s:
              raise SystemExit('forced splash suppression block not found')
          s=s.replace(block,'',1)
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          import re
          w2,n=re.subn(r"const CACHE = 'rotastic-v\d+[^']*';", "const CACHE = 'rotastic-v230-first-splash-only';", w, count=1)
          if n != 1:
              raise SystemExit('cache declaration not found')
          sw.write_text(w2,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --check
          git commit -m "Restore original opening splash"
          git push origin HEAD:main
