name: Apply requested main UI only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply only LIVE ETA weather Export poster amendments') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact original markup and CSS only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Safety: must still be based on exact restored original source anchors.
          for x in ['id="topActionGrid"','id="topExportCard"','onclick="refreshLiveRota()"','id="rotasticLiveMini"','class="live-rota-meta-row w-full"','personal-poster-card']:
              if x not in s: raise SystemExit('Missing expected original anchor: '+x)

          # 1) Move the existing LIVE mini block into the first slot of the existing meta row.
          live_block='''<div class="rotastic-live-mini" id="rotasticLiveMini">\n<span class="relative flex h-1.5 w-1.5 flex-shrink-0">\n  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>\n  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>\n</span>\n<span class="rotastic-live-mini-label">LIVE</span>\n<button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>\n</div>'''
          if s.count(live_block) != 1: raise SystemExit('LIVE block count not exactly 1')
          s=s.replace(live_block+'\n','',1)

          export_card_re=r'<button class="rotastic-top-export-card" id="topExportCard" onclick="toggleRotaExportMenu\(\)" type="button" aria-label="Export rota">.*?</button>\n'
          s,n=re.subn(export_card_re,'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not remove exactly one top export card')

          row_open='<div class="live-rota-meta-row w-full">\n'
          if s.count(row_open)!=1: raise SystemExit('Meta row opening count not 1')
          s=s.replace(row_open,row_open+live_block+'\n',1)

          # 2) Replace only the Refresh action with Export; reuse the existing export function/menu.
          refresh_re=r'<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-\[11px\] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" onclick="refreshLiveRota\(\)" type="button">\n<i class="fa-solid fa-rotate text-\[12px\]"></i><span>Refresh</span>\n</button>'
          export_action='''<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-[11px] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" id="topExportCard" onclick="toggleRotaExportMenu()" type="button">\n<i class="fa-solid fa-arrow-up-from-bracket text-[12px]"></i><span>Export</span><i class="fa-solid fa-chevron-down text-[8px] opacity-70"></i>\n</button>'''
          s,n=re.subn(refresh_re,export_action,s,count=1)
          if n!=1: raise SystemExit('Refresh action was not replaced exactly once')

          # 3) Revert only the v167 enlargement of LIVE/ETA/weather to the earlier compact strip.
          old='''    .live-rota-meta-row {\n      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;\n      gap: 10px !important;\n      align-items: stretch !important;\n    }\n\n    .live-rota-meta-row > div:first-child,\n    .live-drive-slot,\n    #weatherBadge,\n    .rota-action-btn {\n      min-height: 74px;\n      border-radius: 18px;\n    }\n\n    .live-rota-meta-row > div:first-child {\n      padding: 12px 14px;\n      background: rgba(15, 23, 42, .68);\n      border: 1px solid rgba(30, 41, 59, .96);\n    }\n\n    .live-drive-slot {\n      display: flex;\n      align-items: stretch;\n      justify-content: stretch;\n      overflow: visible;\n    }\n\n    .live-drive-slot #driveTimeBtn {\n      width: 100% !important;\n      max-width: none !important;\n      min-width: 0 !important;\n      height: 74px !important;\n      padding: 10px 12px !important;\n      justify-content: center !important;\n      align-items: center !important;\n      gap: 10px !important;\n      border-radius: 18px !important;\n    }'''
          new='''    .live-rota-meta-row {\n      grid-template-columns: auto minmax(92px, 1fr) auto !important;\n      gap: 6px !important;\n      align-items: center !important;\n    }\n\n    .rota-action-btn {\n      min-height: 74px;\n      border-radius: 18px;\n    }\n\n    .live-rota-meta-row .rotastic-live-mini {\n      min-height: 24px;\n      padding: 0 7px;\n      border-radius: 7px;\n      align-self: center;\n    }\n\n    .live-drive-slot {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      overflow: hidden;\n    }\n\n    .live-drive-slot #driveTimeBtn {\n      width: auto !important;\n      max-width: 118px !important;\n      min-width: 88px !important;\n      height: 28px !important;\n      padding: 0 9px !important;\n      justify-content: center !important;\n      align-items: center !important;\n      gap: 6px !important;\n      border-radius: 7px !important;\n    }'''
          if s.count(old)!=1: raise SystemExit('v167 enlargement block count not exactly 1')
          s=s.replace(old,new,1)

          # 4) Extend the existing personal poster down noticeably, preserving all artwork/content/style.
          replacements=[
            ('min-height:390px;overflow:hidden;border-radius:22px','min-height:450px;overflow:hidden;border-radius:22px'),
            ('z-index:2;min-height:390px;padding:22px 18px 18px','z-index:2;min-height:450px;padding:22px 18px 18px'),
            ('.personal-poster-card,.personal-poster-content{min-height:405px}', '.personal-poster-card,.personal-poster-content{min-height:465px}'),
            ('.personal-poster-card,.personal-poster-content{min-height:430px}.live-rota-meta-row', '.personal-poster-card,.personal-poster-content{min-height:470px}.live-rota-meta-row'),
            ('@media (min-width:1181px){.personal-poster-card,.personal-poster-content{min-height:440px}', '@media (min-width:1181px){.personal-poster-card,.personal-poster-content{min-height:480px}')
          ]
          for a,b in replacements:
              if a not in s: raise SystemExit('Poster target missing: '+a[:60])
              s=s.replace(a,b,1)

          # Do not alter splash/date code. Basic exact checks on requested final state.
          if 'onclick="refreshLiveRota()" type="button">\n<i class="fa-solid fa-rotate' in s:
              raise SystemExit('Refresh action still present')
          if s.count('id="topExportCard"')!=1: raise SystemExit('topExportCard ID count not 1')
          if s.count('id="rotasticLiveMini"')!=1: raise SystemExit('LIVE mini ID count not 1')
          if s.find('id="rotasticLiveMini"') > s.find('id="driveTimeBtn"'): raise SystemExit('LIVE is not before ETA')
          if s.find('id="driveTimeBtn"') > s.find('id="weatherBadge"'): raise SystemExit('ETA is not before weather')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only index changed and commit
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply only LIVE ETA weather Export poster amendments"
          git pull --rebase origin main
          git push origin HEAD:main
