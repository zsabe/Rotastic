name: Fix Settings splash and access codes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-settings-splash-access.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source repair
        run: python3 .github/scripts/fix_settings_splash_access.py
      - name: Verify source repair
        run: |
          git diff --check
          test -z "$(grep -n 'id=\"settingsBroadcastCard\"' index.html || true)"
          grep -q 'Temporary Admin code</option>' index.html
          grep -q 'accessSessionUser' index.html
          grep -q 'rotastic-splash-date-paint-guard' index.html
      - name: Commit source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Settings Broadcast splash date and Admin code controls'
          git push origin HEAD:main
