name: Restore personal poster after initialization
on:
  workflow_run:
    workflows: ['Fix stuck opening splash']
    types: [completed]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore poster after profile initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='Post-init personal poster restoration'
          if marker not in s:
              insert="""
<script>
// Post-init personal poster restoration: do not participate in opening splash startup.
(function(){
  function restorePersonalPoster(){
    try {
      if (typeof isAdminViewActive === 'function' && isAdminViewActive()) return;
      if (!window.activeUserDocName && typeof activeUserDocName !== 'undefined' && !activeUserDocName) return;
      if (typeof forcePersonalViewLanding === 'function') forcePersonalViewLanding();
      if (typeof ensurePersonalViewHasContent === 'function') ensurePersonalViewHasContent();
    } catch (_) {}
  }
  window.addEventListener('load', function(){
    setTimeout(restorePersonalPoster, 5500);
  }, {once:true});
})();
</script>
"""
              pos=s.lower().rfind('</body>')
              if pos < 0: raise SystemExit('body close not found')
              s=s[:pos]+insert+s[pos:]
          p.write_text(s)
          PY
      - name: Commit poster restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore personal poster after splash initialization'
          git push origin HEAD:main
