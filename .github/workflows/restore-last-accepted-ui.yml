name: Restore last accepted ROTASTIC UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-last-accepted-ui.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore accepted frontend and cache
        run: |
          git checkout 86d3f9442fac300dce655d7a20f4c61eab96748e -- index.html service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('service-worker.js')
          s=p.read_text()
          s2,n=re.subn(r"rotastic-v\d+[^'\"]*",'rotastic-v243-last-accepted-ui',s,count=1)
          if n: p.write_text(s2)
          PY
          git diff --check
          grep -q 'id="tickerContent"' index.html
          grep -q 'You are off today' index.html
          grep -q 'id="topActionGrid"' index.html
          grep -q 'id="scheduleMatrixContainer"' index.html
          grep -q 'id="notificationBellBtn"' index.html
          grep -q 'id="topExportBtn"' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git rm -f .github/workflows/restore-last-accepted-ui.yml || true
          git commit -m 'Restore last accepted ROTASTIC UI and interactions'
          git push
