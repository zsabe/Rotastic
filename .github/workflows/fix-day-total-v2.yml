name: Fix ROTASTIC day total v2

on:
  push:
    paths:
      - '.github/workflows/fix-day-total-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch day total from authoritative leave records
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"function getDayDisplayedLeaveCount\(day\) \{.*?\n\}\n\nfunction getShiftLeaveCount", re.S)

          replacement = r'''function getDayDisplayedLeaveCount(day) {
            if (!day || !day.isoDate) return 0;

            const isoDate = day.isoDate;
            const found = new Set();
            const addDoctor = function(value) {
              const doctor = canonicalRotaName(cleanDoctorName(value));
              if (doctor && isRealDoctor(doctor)) found.add(doctor);
            };

            // Anything already shown on the daily leave roster.
            (getDisplayedLeaveDoctorsForDay(day) || []).forEach(addDoctor);
            (Array.isArray(day.leaves) ? day.leaves : []).forEach(function(label) {
              const raw = String(label || '');
              const matched = (Array.isArray(DOCTORS) ? DOCTORS : []).find(function(doc) {
                return rotasticLeaveLabelMatchesDoctor(raw, doc.name);
              });
              if (matched) addDoctor(matched.name);
            });

            // Built-in leave dates attached to doctor records.
            (Array.isArray(DOCTORS) ? DOCTORS : []).forEach(function(doc) {
              if (doc && Array.isArray(doc.leaves) && doc.leaves.includes(isoDate)) addDoctor(doc.name);
            });

            // Shared leave submissions. Sick leave is immediate; other leave counts
            // when approved/scheduled/historical. Pending/rejected/cancelled requests do not.
            const submissions = Storage.getJSON('rotastic_leave_submissions', []);
            (Array.isArray(submissions) ? submissions : []).forEach(function(item) {
              if (!item || !item.doc || !item.startDate) return;
              const endDate = item.endDate || item.startDate;
              if (isoDate < item.startDate || isoDate > endDate) return;

              const type = String(item.type || '').toLowerCase();
              const status = String(item.status || '').toLowerCase();
              const rejected = /reject|declin|cancel|withdraw/.test(status);
              const pending = /pending|request|await/.test(status);
              const accepted = type === 'sick' || /approved|scheduled|historical/.test(status);
              if (!rejected && (accepted || (!pending && !status))) addDoctor(item.doc);
            });

            // Immediate sick-leave mirror used by backend sync.
            const sick = Storage.getJSON('rotastic_sick_leave_records', []);
            (Array.isArray(sick) ? sick : []).forEach(function(item) {
              if (item && item.doc && item.date === isoDate) addDoctor(item.doc);
            });

            return found.size;
          }

          function getShiftLeaveCount'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one day-total function, found {count}')
          path.write_text(updated, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix day total from leave records"
          git push origin HEAD:main
