name: Build ROTASTIC Android APK

on:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'android-app/**'
      - 'icons/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add app icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          cp icons/icon-512.png android-app/app/src/main/res/drawable/rotastic_icon.png
      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk ROTASTIC-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ROTASTIC-Android-APK
          path: ROTASTIC-Android.apk
          if-no-files-found: error
