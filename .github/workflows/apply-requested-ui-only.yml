name: Apply requested UI only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply requested UI only exact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only requested controls and poster height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          before = s

          required = [
              'id="topActionGrid"',
              'id="topExportCard"',
              'onclick="refreshLiveRota()"',
              'id="rotasticLiveMini"',
              'id="driveTimeBtn"',
              'id="weatherBadge"',
              'personal-poster-card'
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('Missing expected working-view anchor: ' + marker)

          # Existing LIVE block, unchanged internally.
          live_re = re.compile(r'<div class="rotastic-live-mini" id="rotasticLiveMini">.*?</div>', re.S)
          live_matches = list(live_re.finditer(s))
          if len(live_matches) != 1:
              raise SystemExit(f'Expected one LIVE block, found {len(live_matches)}')
          live_block = live_matches[0].group(0)

          # Remove LIVE from its old standalone position.
          s = s[:live_matches[0].start()] + s[live_matches[0].end():]

          # Replace the existing large Export card in the metadata row with LIVE.
          export_meta_re = re.compile(
              r'<button class="rotastic-top-export-card" id="topExportCard" onclick="toggleRotaExportMenu\(\)" type="button" aria-label="Export rota">.*?</button>',
              re.S
          )
          s, n = export_meta_re.subn(live_block, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace exactly one metadata Export card')

          # Replace only Refresh with Export, preserving the existing export menu function.
          refresh_re = re.compile(
              r'<button class="rota-action-btn ([^"]*)" onclick="refreshLiveRota\(\)" type="button">\s*<i class="fa-solid fa-rotate[^>]*></i><span>Refresh</span>\s*</button>',
              re.S
          )
          m = refresh_re.search(s)
          if not m:
              raise SystemExit('Refresh action button not found exactly')
          export_button = (
              '<button class="rota-action-btn ' + m.group(1) + '" id="topExportCard" onclick="toggleRotaExportMenu()" type="button">\n'
              '<i class="fa-solid fa-arrow-up-from-bracket text-[12px]"></i><span>Export</span><i class="fa-solid fa-chevron-down text-[8px] opacity-70"></i>\n'
              '</button>'
          )
          s = s[:m.start()] + export_button + s[m.end():]

          # Add one narrowly-scoped final CSS override immediately before </style>.
          # This changes only LIVE/ETA/weather sizing/boxing and personal poster height.
          css = r'''

/* requested-ui-only-2026-10-27 */
.live-rota-meta-row {
  grid-template-columns: auto minmax(82px, 1fr) auto !important;
  align-items: center !important;
  gap: 7px !important;
}
.live-rota-meta-row .rotastic-live-mini {
  min-height: 24px !important;
  height: 24px !important;
  padding: 0 6px !important;
  margin: 0 !important;
  align-self: center !important;
}
.live-rota-meta-row .live-drive-slot {
  min-height: 24px !important;
  height: 24px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  overflow: visible !important;
}
.live-rota-meta-row #driveTimeBtn {
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  height: 24px !important;
  min-height: 24px !important;
  padding: 0 3px !important;
  margin: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  gap: 4px !important;
  font-size: 10px !important;
  line-height: 1 !important;
}
.live-rota-meta-row #driveTimeBtnText {
  font-size: 10px !important;
  line-height: 1 !important;
  white-space: nowrap !important;
}
.live-rota-meta-row #driveTimeBtnSub {
  display: none !important;
}
.live-rota-meta-row #weatherBadge {
  width: auto !important;
  min-width: 0 !important;
  min-height: 24px !important;
  height: 24px !important;
  max-height: 24px !important;
  padding: 0 3px !important;
  margin: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  font-size: 10px !important;
  line-height: 1 !important;
}
.live-rota-meta-row #weatherCondition {
  display: none !important;
}
.personal-poster-card,
.personal-poster-content {
  min-height: clamp(500px, calc(100svh - 330px), 620px) !important;
}
@media (orientation: landscape) and (max-height: 700px) {
  .personal-poster-card,
  .personal-poster-content {
    min-height: 285px !important;
  }
}
'''
          if 'requested-ui-only-2026-10-27' in s:
              raise SystemExit('Requested override already present unexpectedly')
          # Use the final </style> before body markup so no script/HTML structure is touched.
          style_pos = s.rfind('</style>')
          if style_pos < 0:
              raise SystemExit('No style closing tag found')
          s = s[:style_pos] + css + s[style_pos:]

          # Safety checks: requested state only.
          if 'onclick="refreshLiveRota()"' in s:
              raise SystemExit('Refresh button still present')
          if s.count('id="topExportCard"') != 1:
              raise SystemExit('Export button id count is not exactly 1')
          if s.count('id="rotasticLiveMini"') != 1:
              raise SystemExit('LIVE block id count is not exactly 1')
          order = [s.find('id="rotasticLiveMini"'), s.find('id="driveTimeBtn"'), s.find('id="weatherBadge"')]
          if not (order[0] < order[1] < order[2]):
              raise SystemExit('LIVE / ETA / Weather order is wrong')

          # Protect unrelated critical anchors and clickability.
          protected = [
              'id="announcementTicker"',
              'id="scheduleMatrixContainer"',
              'onclick="openSwapRequestModal()"',
              'id="rotaZoomBtn"',
              'id="rotaDaySelector"',
              'id="tabSchedule"'
          ]
          for marker in protected:
              if marker not in s:
                  raise SystemExit('Protected anchor missing after patch: ' + marker)

          if s == before:
              raise SystemExit('No change made')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify and commit only index.html
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply requested UI only exact"
          git pull --rebase origin main
          git push origin HEAD:main
