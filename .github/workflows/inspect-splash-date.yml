name: Inspect ROTASTIC splash date

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-splash-date.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract splash/date references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          lines=s.splitlines()
          pats=re.compile(r'splash|today|january|current.?date|current.?day|dateLabel|welcome|qatar',re.I)
          hits=[]
          for i,l in enumerate(lines):
            if pats.search(l):
              a=max(0,i-5); b=min(len(lines),i+10)
              hits.append(f'===== hit line {i+1} =====')
              hits.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('splash-date-inspection.txt').write_text('\n'.join(hits[:2500]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splash-date-inspection.txt
          git commit -m 'Add temporary splash date inspection'
          git push
