name: Apply three UI amendments only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove Refresh only from current action row') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only Refresh from current action row
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          for x in ['id="topActionGrid"','id="rotaZoomBtn"','onclick="openSwapRequestModal()"','onclick="toggleRotaExportMenu()"','id="rotasticLiveMini"','id="driveTimeBtn"','id="weatherBadge"','id="requested-ui-only-20261027"','personal-poster-card']:
              if x not in s: raise SystemExit('Missing required preserved anchor: '+x)
          i=s.find('id="topActionGrid"')
          a=s.rfind('<div',0,i)
          b=s.find('</div>',i)
          if a<0 or b<0: raise SystemExit('Could not isolate action row')
          row=s[a:b+6]
          refresh=re.compile(r'<button\b[^>]*onclick="refreshLiveRota\(\)"[^>]*>.*?</button>\s*',re.S)
          row2,n=refresh.subn('',row,count=1)
          if n!=1: raise SystemExit(f'Expected one Refresh button in action row, found {n}')
          s=s[:a]+row2+s[b+6:]
          for x in ['id="rotaZoomBtn"','onclick="openSwapRequestModal()"','onclick="toggleRotaExportMenu()"','id="rotasticLiveMini"','id="driveTimeBtn"','id="weatherBadge"','id="requested-ui-only-20261027"','personal-poster-card']:
              if x not in s: raise SystemExit('Preserved anchor lost: '+x)
          if 'onclick="refreshLiveRota()"' in row2: raise SystemExit('Refresh still present')
          # Do not touch splash/date, tabs, handlers, service worker, or any other file.
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Refresh only from current action row"
          git pull --rebase origin main
          git push origin HEAD:main
