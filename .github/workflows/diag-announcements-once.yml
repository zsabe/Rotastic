name: Apply announcement updates once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_announcements.py
      - name: Verify and publish
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .diag-announcements.txt .github/scripts/patch_announcements.py .github/workflows/diag-announcements-once.yml
          git commit -m "Expand medical stats and add CPD announcements"
          git pull --rebase origin main
          git push
