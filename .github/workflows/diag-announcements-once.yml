name: Apply announcement updates once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch announcements only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # 1) Broaden curated numeric medical facts across family-practice scope.
          pat=r"const ROTASTIC_CURATED_CLINICAL_UPDATES = \[.*?\n\];"
          repl="""const ROTASTIC_CURATED_CLINICAL_UPDATES = [
  '🇶🇦 Qatar: hypertension affects about 41% of adults aged 30–79.',
  '❤️ Qatar: only 24% of adults with hypertension had controlled BP.',
  '⚖️ Qatar: adult obesity was estimated at about 42%.',
  '🩺 Qatar primary care: multimorbidity affected 22% of adults.',
  '👩 Qatar multimorbidity data: 51% of affected patients were women.',
  '🧂 Qatar: mean adult salt intake was about 7 g/day.',
  '🚶 Qatar: physical inactivity was estimated at 37% of adults.',
  '🇦🇪 UAE: adult diabetes prevalence was estimated at about 21%.',
  '🇰🇼 Kuwait: adult diabetes prevalence was estimated at about 26%.',
  '🇸🇦 Saudi Arabia: diabetes prevalence is above 15% in many adult estimates.',
  '🇧🇭 Bahrain: adult diabetes prevalence is above 15% in major estimates.',
  '🇯🇴 Jordan: diabetes affects roughly 1 in 6 adults in several national estimates.',
  '🇱🇧 Lebanon: hypertension affects around 1 in 3 adults in many population studies.',
  '🌍 WHO 2024: about 1.4 billion adults aged 30–79 had hypertension — 33% of that age group.',
  '🫀 WHO: only about 23% of adults with hypertension have it controlled.',
  '❤️ WHO 2022: cardiovascular disease caused about 19.8 million deaths — 32% of global deaths.',
  '🧠 WHO 2023: depression affected about 5.2% of adults worldwide.',
  '🌧️ WHO 2023: about 322 million people were living with depression.',
  '🫁 WHO 2023: asthma affected about 363 million people worldwide.',
  '💨 WHO 2023: asthma caused about 442,000 deaths worldwide.',
  '🚭 WHO: COPD caused about 3.4 million deaths in 2023 — roughly 6% of global deaths.',
  '🫁 WHO estimate: about 392 million people were living with COPD globally.',
  '⚖️ WHO 2024: 45% of adults worldwide were overweight; about 16% were living with obesity.',
  '👧 WHO 2024: 20% of children and adolescents aged 5–19 were overweight.',
  '🧒 WHO 2024: about 8% of children and adolescents aged 5–19 were living with obesity.',
  '🩸 WHO: anaemia affects about 30.7% of women aged 15–49 worldwide.',
  '🤰 WHO: anaemia affects about 35.5% of pregnant women aged 15–49 worldwide.',
  '🧠 WHO 2021: headache disorders affected about 40% of the global population — around 3.1 billion people.',
  '🎗️ IARC 2022: there were about 20 million new cancer cases worldwide.',
  '🎗️ IARC 2022: cancer caused about 9.7 million deaths worldwide.',
  '🌍 IDF: 589 million adults live with diabetes worldwide — nearly 1 in 9.',
  '🔎 About 252 million adults with diabetes may be undiagnosed.',
  '📈 Global adult diabetes cases may reach 853 million by 2050.',
  '💊 SOUL: CV events were 12.0% with oral semaglutide vs 13.8% with placebo.',
  '🏃 SELECT: CV events were 6.5% with semaglutide vs 8.0% with placebo.'
];"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          assert n==1, 'clinical updates array anchor not found'

          # 2) Add date-aware CPD event list and selector.
          anchor="let rotasticLiveClinicalUpdates = [];"
          assert anchor in s
          cpd_block="""
const ROTASTIC_CPD_EVENTS = [
  {startDate:'2026-10-31', endDate:'2026-11-01', text:'🇦🇪 CPD • EHS International Pediatric & Critical Care Conference • 31 Oct–1 Nov 2026 • Dubai', link:'https://ippccc.com/'},
  {startDate:'2026-11-04', endDate:'2026-11-07', text:'🇶🇦 CPD • Qatar International Neonatal Conference • 4–7 Nov 2026 • Category 1/3 credits available', link:'https://www.cmegallery.com/events/pediatrics/qatar-international-neonatal-conference-qinc-2026-doha-2026'},
  {startDate:'2026-11-05', endDate:'2026-11-06', text:'🇦🇪 CPD • Global Pediatric Congress • 5–6 Nov 2026 • Dubai', link:'https://globalpediatriccongress.com/'},
  {startDate:'2026-11-12', endDate:'2026-11-12', text:'🇸🇦 CPD • Al Salama Family Medicine Conference • 12 Nov 2026 • 8 CME hours', link:'https://alsalamahospital.com/en/events/al-salama-2nd-family-medicine-conference/var/ri-0.l-L2/'},
  {startDate:'2026-11-20', endDate:'2026-11-21', text:'🇰🇼 CPD • 2nd GCC Pediatric Associations Conference • 20–21 Nov 2026 • 16 CME points', link:'https://www.gccped.com/'},
  {startDate:'2026-11-27', endDate:'2026-11-28', text:'🇸🇦 CPD • Family Medicine & Lifestyle Medicine Conference • 27–28 Nov 2026 • Riyadh', link:'https://www.doctorksa.com/events/international-conference-on-family-medicine-and-lifestyle-medicine-icfmlm-26'},
  {startDate:'2026-12-04', endDate:'2026-12-05', text:'🇶🇦 CPD • Updates in Primary Care 2026 • 4–5 Dec 2026 • Doha • CME-accredited', link:'https://qatar-weill.cornell.edu/event/alumni-conference'},
  {startDate:'2026-12-08', endDate:'2026-12-12', text:'🌐 CPD • AAFP Family Medicine Update Winter Livestream • 8–12 Dec 2026 • 27 credits', link:'https://www.aafp.org/cme-and-events/topics/clinical-procedural-skills/family-medicine-update/stream-winter'},
  {startDate:'2026-12-09', endDate:'2026-12-10', text:'🇶🇦 CPD • Sidra Hypospadias Symposium • 9–10 Dec 2026 • 10.5 CPD hours', link:'https://www.sidra.org/events/2nd-international-symposium-on-hypospadias-from-foundations-to-frontiers/'},
  {startDate:'2026-10-27', endDate:'2027-10-24', text:'🌐 CPD • AAFP Pediatrics Online CME • on demand • 28 credits', link:'https://www.aafp.org/cme-and-events/on-demand'}
];
let rotasticCpdEventIndex = 0;
let rotasticCpdSlotCounter = 0;

function chooseActiveCpdEvent() {
  const today = (getQatarClock && getQatarClock().isoDate) || new Date().toISOString().slice(0,10);
  const active = ROTASTIC_CPD_EVENTS.filter(function(item) {
    return item && item.endDate >= today;
  });
  if (!active.length) return null;
  const event = active[rotasticCpdEventIndex % active.length];
  rotasticCpdEventIndex = (rotasticCpdEventIndex + 1) % active.length;
  return event;
}

"""
          s=s.replace(anchor,cpd_block+anchor,1)

          # 3) Insert occasional CPD item into existing medical-news slots.
          old="""  if (cycleStep === 3 || cycleStep === 8 || cycleStep === 12) {
    const medicalHeadline = chooseLatestMedicalHeadline();

    if (medicalHeadline) {
      renderTickerCard('medicalnews', medicalHeadline, 6500);
      return;
    }
"""
          new="""  if (cycleStep === 3 || cycleStep === 8 || cycleStep === 12) {
    rotasticCpdSlotCounter += 1;
    if (rotasticCpdSlotCounter % 4 === 1) {
      const cpdEvent = chooseActiveCpdEvent();
      if (cpdEvent) {
        rotasticCurrentMedicalLink = cpdEvent.link;
        rotasticCurrentMedicalSourceMeta = {name:'CPD event', domain:(new URL(cpdEvent.link)).hostname.replace(/^www\\./,'')};
        renderTickerCard('medicalnews', cpdEvent.text, 7600);
        return;
      }
    }

    const medicalHeadline = chooseLatestMedicalHeadline();

    if (medicalHeadline) {
      renderTickerCard('medicalnews', medicalHeadline, 6500);
      return;
    }
"""
          assert old in s, 'medical headline slot anchor not found'
          s=s.replace(old,new,1)

          # 4) Ticker alignment only: prayer one text line lower; constrain right edge.
          css_anchor="""    #tickerInnerRow:not(.ticker-fullwidth-mode) .news-drop-item {
      height: 68px;
      min-height: 68px;
      max-height: 68px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
"""
          assert css_anchor in s, 'ticker geometry css anchor not found'
          css_extra=css_anchor+"""

    /* Announcement alignment refinements: keep copy inside the usable width. */
    #tickerContent {
      min-width: 0 !important;
      overflow: hidden !important;
    }
    #tickerInnerRow:not(.ticker-fullwidth-mode) .ticker-left-card {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding-right: 12px !important;
      overflow: hidden !important;
    }
    #tickerInnerRow:not(.ticker-fullwidth-mode) .ticker-medical-link,
    #tickerInnerRow:not(.ticker-fullwidth-mode) .ticker-message-text {
      max-width: 100% !important;
      overflow-wrap: anywhere !important;
    }
    #tickerInnerRow:not(.ticker-fullwidth-mode) .ticker-prayer-card {
      transform: translateY(7px);
    }
"""
          s=s.replace(css_anchor,css_extra,1)

          p.write_text(s,encoding='utf-8')
          assert s != original
          # Surgical sanity checks.
          for needle in ['ROTASTIC_CPD_EVENTS','chooseActiveCpdEvent','8 CME hours','16 CME points','27 credits','ticker-prayer-card','translateY(7px)']:
            assert needle in s, needle
          PY

          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .diag-announcements.txt .github/workflows/diag-announcements-once.yml
          git commit -m "Expand medical stats and add CPD announcements"
          git pull --rebase origin main
          git push
