name: Diagnose announcements once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate announcement code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=['announcement','ticker','prayer','diabetes','obesity','swapsNewsTicker','tickerContent','medical','health stat','CPD']
          hits=[]
          for i,line in enumerate(s,1):
              low=line.lower()
              if any(t.lower() in low for t in terms):
                  hits.append(i)
          seen=set()
          for i in hits:
              a=max(1,i-5); b=min(len(s),i+10)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              print(f'--- lines {a}-{b} ---')
              for n in range(a,b+1):
                  print(f'{n}: {s[n-1]}')
          PY
