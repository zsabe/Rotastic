name: Diagnose announcements once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture ticker rotation code
        run: |
          python - <<'PY'
          from pathlib import Path
          raw=Path('index.html').read_text(encoding='utf-8')
          needles=['function renderNextTickerSlot','function getPrayerTickerMessages','function renderRegularTickerMessage','function renderPrayerTicker','rotasticCurrentTickerLink']
          out=[]
          for needle in needles:
              start=0
              while True:
                  pos=raw.find(needle,start)
                  if pos<0: break
                  out.append(f'=== {needle} @ {pos} ===')
                  out.append(raw[max(0,pos-1200):min(len(raw),pos+9000)])
                  start=pos+1
          Path('.diag-announcements.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diag-announcements.txt
          git commit -m "Capture ticker rotation diagnostics" || exit 0
          git pull --rebase origin main
          git push
