name: Fix stuck opening splash
on:
  push:
    paths:
      - '.github/workflows/fix-splash-dismiss.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair splash completion only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="if (typeof isAdminViewActive === 'function' && isAdminViewActive()) return;\n      forcePersonalViewLanding();\n      ensurePersonalViewHasContent();"
          good="if (!activeUserDocName) return;\n      forcePersonalViewLanding();\n      ensurePersonalViewHasContent();"
          if bad in s:
              s=s.replace(bad,good,1)
          anchor="document.addEventListener('DOMContentLoaded', function() {"
          guard="""document.addEventListener('DOMContentLoaded', function() {
  // Opening splash must never block the application indefinitely.
  setTimeout(function() {
    const splash = document.getElementById('rotasticOpeningSplash');
    if (!splash) return;
    try {
      splash.style.pointerEvents = 'none';
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
      splash.style.display = 'none';
      splash.setAttribute('aria-hidden', 'true');
    } catch (_) {}
  }, 5000);"""
          if 'Opening splash must never block the application indefinitely.' not in s:
              idx=s.rfind(anchor)
              if idx < 0: raise SystemExit('startup anchor not found')
              s=s[:idx]+s[idx:].replace(anchor,guard,1)
          p.write_text(s)
          PY
      - name: Verify targeted repair
        run: |
          grep -n "Opening splash must never block" index.html
          grep -n "if (!activeUserDocName) return" index.html | tail -3
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix stuck opening splash without altering app UI'
          git push origin HEAD:main
