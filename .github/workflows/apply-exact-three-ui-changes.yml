name: Apply exact three UI changes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply exact requested three UI changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original page then apply only requested changes
        run: |
          git checkout 80a30db853656cb21c7a730ff7c54836ca5e43c9 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Exact original anchors: abort if anything differs.
          required=[
            'id="topActionGrid"',
            'id="topExportCard"',
            'onclick="refreshLiveRota()"',
            'id="rotasticLiveMini"',
            'class="live-rota-meta-row w-full"',
            'id="driveTimeBtn"',
            'id="weatherBadge"',
            '.personal-poster-card{position:relative;min-height:390px'
          ]
          for x in required:
            if x not in s: raise SystemExit('Missing expected original anchor: '+x)

          # 1) LIVE / ETA / Weather on the same compact line.
          live='''<div class="rotastic-live-mini" id="rotasticLiveMini">\n<span class="relative flex h-1.5 w-1.5 flex-shrink-0">\n  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>\n  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>\n</span>\n<span class="rotastic-live-mini-label">LIVE</span>\n<button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>\n</div>'''
          if s.count(live)!=1: raise SystemExit('LIVE block count must be 1')
          s=s.replace(live+'\n','',1)

          export_top=r'<button class="rotastic-top-export-card" id="topExportCard" onclick="toggleRotaExportMenu\(\)" type="button" aria-label="Export rota">.*?</button>\n'
          s,n=re.subn(export_top,'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not remove original top export card exactly once')

          row='<div class="live-rota-meta-row w-full">\n'
          if s.count(row)!=1: raise SystemExit('Meta row count must be 1')
          s=s.replace(row,row+live+'\n',1)

          # 2) Remove Refresh and keep three action boxes: Rota View / Request Swap / Export.
          refresh=r'<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-\[11px\] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" onclick="refreshLiveRota\(\)" type="button">\n<i class="fa-solid fa-rotate text-\[12px\]"></i><span>Refresh</span>\n</button>'
          export='''<button class="rota-action-btn w-full justify-center px-3 py-2 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-slate-800 text-[11px] sm:text-xs font-bold text-teal-300 transition flex items-center gap-2" id="topExportCard" onclick="toggleRotaExportMenu()" type="button">\n<i class="fa-solid fa-arrow-up-from-bracket text-[12px]"></i><span>Export</span><i class="fa-solid fa-chevron-down text-[8px] opacity-70"></i>\n</button>'''
          s,n=re.subn(refresh,export,s,count=1)
          if n!=1: raise SystemExit('Refresh button was not replaced exactly once')

          # 3) Keep ETA + weather small and unboxed. Preserve their click handlers/links.
          marker='''    /* v167 — publish-ready interaction and layout polish */'''
          idx=s.find(marker)
          if idx<0: raise SystemExit('v167 marker missing')
          end=s.find('    /* v168', idx)
          if end<0: raise SystemExit('v168 marker missing')
          block=s[idx:end]
          block=re.sub(r'''    \.live-rota-meta-row \{.*?    #driveTimeBtnSub \{''', '''    .live-rota-meta-row {\n      grid-template-columns: auto minmax(92px,1fr) auto !important;\n      gap: 6px !important;\n      align-items: center !important;\n    }\n\n    .rota-action-btn {\n      min-height: 74px;\n      border-radius: 18px;\n    }\n\n    .live-rota-meta-row .rotastic-live-mini {\n      min-height: 24px !important;\n      height: 24px !important;\n      padding: 0 4px !important;\n      border: 0 !important;\n      background: transparent !important;\n      box-shadow: none !important;\n    }\n\n    .live-drive-slot {\n      display:flex; align-items:center; justify-content:center; overflow:hidden;\n    }\n    .live-drive-slot #driveTimeBtn {\n      width:auto !important; min-width:88px !important; max-width:118px !important;\n      height:24px !important; padding:0 4px !important; gap:5px !important;\n      border:0 !important; background:transparent !important; box-shadow:none !important;\n      border-radius:0 !important;\n    }\n    #weatherBadge {\n      height:24px !important; min-height:24px !important; max-height:24px !important;\n      padding:0 4px !important; border:0 !important; background:transparent !important;\n      box-shadow:none !important; border-radius:0 !important;\n    }\n\n    #driveTimeBtnSub {''', block, count=1, flags=re.S)
          s=s[:idx]+block+s[end:]

          # Make poster longer to fill the mobile screen better; no content/style changes.
          pairs=[
            ('min-height:390px;overflow:hidden;border-radius:22px','min-height:470px;overflow:hidden;border-radius:22px'),
            ('z-index:2;min-height:390px;padding:22px 18px 18px','z-index:2;min-height:470px;padding:22px 18px 18px'),
            ('.personal-poster-card,.personal-poster-content{min-height:405px}', '.personal-poster-card,.personal-poster-content{min-height:500px}'),
            ('.personal-poster-card,.personal-poster-content{min-height:430px}.live-rota-meta-row', '.personal-poster-card,.personal-poster-content{min-height:500px}.live-rota-meta-row'),
            ('@media (min-width:1181px){.personal-poster-card,.personal-poster-content{min-height:440px}', '@media (min-width:1181px){.personal-poster-card,.personal-poster-content{min-height:500px}')
          ]
          for a,b in pairs:
            if a not in s: raise SystemExit('Poster height anchor missing: '+a[:50])
            s=s.replace(a,b,1)

          # Final safety checks: preserve working controls and only requested structure.
          checks=['onclick="openSwapRequestModal()"','onclick="toggleRotaExportMenu()"','data-rotastic-rota-toggle="1"','id="scheduleMatrixContainer"','id="announcementTicker"']
          for x in checks:
            if x not in s: raise SystemExit('Critical working anchor missing: '+x)
          if s.count('id="topExportCard"')!=1: raise SystemExit('Export ID count wrong')
          if s.count('id="rotasticLiveMini"')!=1: raise SystemExit('LIVE ID count wrong')
          if 'onclick="refreshLiveRota()" type="button">\n<i class="fa-solid fa-rotate' in s: raise SystemExit('Refresh action remains')
          if not (s.find('id="rotasticLiveMini"') < s.find('id="driveTimeBtn"') < s.find('id="weatherBadge"')):
            raise SystemExit('LIVE/ETA/weather order incorrect')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply exact requested three UI changes"
          git pull --rebase origin main
          git push origin HEAD:main
