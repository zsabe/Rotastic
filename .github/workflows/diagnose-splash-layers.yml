name: Diagnose splash layers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-splash-layers.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect splash markup and startup paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          print('=== 6175-6210 ===')
          for i in range(6175,6211): print(i, lines[i-1])
          print('=== 7600-7665 ===')
          for i in range(7600,7666): print(i, lines[i-1])
          print('=== all registration gate class mutations ===')
          for i,line in enumerate(lines,1):
              if 'rotasticRegistrationGate' in line or ('gate.' in line and 7580 <= i <= 7700): print(i,line[:700])
          PY
