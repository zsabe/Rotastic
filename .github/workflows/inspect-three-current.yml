name: Inspect current top action row
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'Write current top action row') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='id="topActionGrid"'
          i=s.find(marker)
          if i<0: raise SystemExit('topActionGrid not found')
          a=s.rfind('<div',0,i)
          b=s.find('</div>',i)
          if a<0 or b<0: raise SystemExit('topActionGrid bounds not found')
          Path('top-action-current.txt').write_text(s[a:b+6],encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-action-current.txt
          git commit -m "Write current top action row"
          git pull --rebase origin main
          git push origin HEAD:main
