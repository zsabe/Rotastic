name: Inspect current three elements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'Write current three element snippets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for needle,r in [('requested-ui-only-20261027',3500),('live-rota-meta-row w-full',5000),('topActionGrid',4500),('personal-poster-card',2500)]:
              i=s.find(needle)
              out.append(f'===== {needle} @ {i} =====\n')
              if i>=0: out.append(s[max(0,i-r):min(len(s),i+r)]+'\n')
          Path('three-current.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three-current.txt
          git commit -m "Write current three element snippets"
          git pull --rebase origin main
          git push origin HEAD:main
