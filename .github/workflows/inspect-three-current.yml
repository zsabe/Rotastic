name: Inspect exact Refresh markup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'Write exact Refresh snippet') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Refresh vicinity only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('refreshLiveRota')
          if i<0: raise SystemExit('refreshLiveRota not found')
          Path('refresh-current.txt').write_text(s[max(0,i-2200):min(len(s),i+2600)],encoding='utf-8')
          PY
      - name: Commit snippet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refresh-current.txt
          git commit -m "Write exact Refresh snippet"
          git pull --rebase origin main
          git push origin HEAD:main
