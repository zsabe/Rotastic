name: Patch unified access code card

on:
  push:
    paths:
      - '.github/workflows/patch-unified-access-codes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply access-code patch
        shell: bash
        run: |
          sed -i "s/s = fn_pattern.sub(new_fn, s, count=1)/s = fn_pattern.sub(lambda _m: new_fn, s, count=1)/" .github/scripts/patch_unified_access_codes.py
          python .github/scripts/patch_unified_access_codes.py
      - name: Guard patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = ".github/scripts/patch_unified_access_codes.py index.html " || test "$(git diff --name-only | tr '\n' ' ')" = "index.html .github/scripts/patch_unified_access_codes.py "
          git checkout -- .github/scripts/patch_unified_access_codes.py
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q 'id="accessCodeType"' index.html
          grep -q 'id="accessCodeDoctorSelect"' index.html
          grep -q 'sendLastAccessCodeViaOutlook' index.html
          grep -q "functions.invoke('rotastic-registration-admin'" index.html
          grep -q 'p_target_physician: physicianName' index.html
          ! git diff -- index.html | grep -E '^[+-].*<(style|link|body|main|nav|script src)' || (echo 'Unexpected global design/runtime markup change' && exit 1)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add unified physician access code card'
          git push origin HEAD:main
