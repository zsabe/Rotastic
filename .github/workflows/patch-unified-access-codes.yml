name: Patch unified access code card

on:
  push:
    paths:
      - '.github/workflows/patch-unified-access-codes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch existing dark access-code card only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          card_pattern=re.compile(r'<div class="hidden clean-card rounded-2xl p-5 max-w-xl mx-auto border-violet-500/25" id="tempAdminCodeManagerCard">.*?</div>\s*<div class="hidden clean-card rounded-2xl p-5 max-w-xl mx-auto border-emerald-500/25" id="adminAccessGrantCard">',re.S)
          if len(list(card_pattern.finditer(s)))!=1: raise SystemExit('Expected exactly one violet admin-code card; aborting.')
          new_card='''<div class="hidden clean-card rounded-2xl p-5 max-w-xl mx-auto border-violet-500/25" id="tempAdminCodeManagerCard">
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-800"><div><h3 class="text-xs font-bold text-violet-300 uppercase tracking-wider flex items-center"><i class="fa-solid fa-key mr-2"></i>Access Codes</h3><p class="text-[11px] text-slate-400 mt-1">Issue a first-time setup code or temporary Admin View code for an authorised physician.</p></div></div>
<div class="pt-4 space-y-3"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
<select class="bg-slate-900 text-white text-xs px-3 py-2.5 rounded-xl border border-slate-700 outline-none" id="accessCodeType" onchange="onAccessCodeTypeChange()"><option value="first_time">First-time setup code</option><option value="admin">Temporary Admin code</option></select>
<select class="bg-slate-900 text-white text-xs px-3 py-2.5 rounded-xl border border-slate-700 outline-none" id="accessCodeDoctorSelect"><option value="">Select physician</option></select></div>
<div class="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2"><select class="bg-slate-900 text-white text-xs px-3 py-2.5 rounded-xl border border-slate-700 outline-none" id="tempAdminDurationMinutes"><option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="240">4 hours</option><option selected="" value="480">8 hours</option><option value="720">12 hours</option><option value="1440">24 hours</option><option value="2880">2 days</option><option value="4320">3 days</option><option value="10080">1 week</option><option value="20160">2 weeks</option><option value="30240">3 weeks</option><option value="43200">1 month</option></select><button class="px-4 py-2.5 bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs rounded-xl transition" onclick="createSelectedAccessCode()" type="button" id="createAccessCodeButton"><i class="fa-solid fa-plus mr-1.5"></i>Generate Code</button></div><div class="text-[10px] text-slate-500" id="accessCodeModeHint">First-time setup codes are valid for 24 hours.</div></div>
<div class="hidden mt-3 p-3 rounded-xl bg-violet-950/30 border border-violet-500/30" id="newTempAdminCodeBox"><div class="text-[10px] uppercase tracking-wider font-bold text-violet-300" id="newTempAdminCodeLabel">New access code</div><div class="text-xl font-black tracking-[0.18em] text-white mt-1 select-all" id="newTempAdminCodeValue"></div><div class="text-[10px] text-slate-400 mt-1" id="newTempAdminCodeExpiry"></div><button class="hidden mt-3 w-full px-3 py-2.5 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/25 text-sky-300 text-xs font-black" id="sendAccessCodeOutlookBtn" onclick="sendLastAccessCodeViaOutlook()" type="button"><i class="fa-regular fa-envelope mr-1.5"></i>Send via Outlook</button></div>
<div class="mt-4"><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-2">Active / recent Admin View codes</div><div class="space-y-2" id="tempAdminCodeList"></div></div></div>
<div class="hidden clean-card rounded-2xl p-5 max-w-xl mx-auto border-emerald-500/25" id="adminAccessGrantCard">'''
          s=card_pattern.sub(new_card,s,count=1)
          fn_pattern=re.compile(r'async function createTemporaryAdminCode\(\) \{.*?\n\}\n\nasync function revokeTemporaryAdminCode',re.S)
          if len(list(fn_pattern.finditer(s)))!=1: raise SystemExit('Expected exactly one createTemporaryAdminCode function; aborting.')
          new_fn='''let rotasticLastIssuedAccessCode = null;
function populateAccessCodeDoctorSelect(){const select=document.getElementById('accessCodeDoctorSelect');if(!select||typeof getDoctorsAlphabetically!=='function')return;const current=select.value;select.innerHTML='<option value="">Select physician</option>'+getDoctorsAlphabetically().filter(function(d){return d&&d.name;}).map(function(d){return '<option value="'+String(d.name).replace(/"/g,'&quot;')+'">'+d.name+'</option>';}).join('');if(current)select.value=current;}
function onAccessCodeTypeChange(){const type=document.getElementById('accessCodeType')?.value||'first_time';const duration=document.getElementById('tempAdminDurationMinutes');const hint=document.getElementById('accessCodeModeHint');if(duration){duration.disabled=type==='first_time';if(type==='first_time')duration.value='1440';}if(hint)hint.textContent=type==='first_time'?'First-time setup codes are valid for 24 hours.':'Choose how long this physician can unlock Admin View.';}
function rotasticAccessCodeEmailForDoctor(docName){try{if(typeof getKnownPhysicianEmail==='function')return String(getKnownPhysicianEmail(docName)||'').trim().toLowerCase();}catch(e){}return '';}
function showIssuedAccessCode(kind,physicianName,email,code,expiresAt){rotasticLastIssuedAccessCode={kind,physicianName,email,code,expiresAt};const box=document.getElementById('newTempAdminCodeBox'),label=document.getElementById('newTempAdminCodeLabel'),val=document.getElementById('newTempAdminCodeValue'),expiry=document.getElementById('newTempAdminCodeExpiry'),outlook=document.getElementById('sendAccessCodeOutlookBtn');if(box)box.classList.remove('hidden');if(label)label.textContent=kind==='first_time'?'New first-time setup code':'New Admin View code';if(val)val.innerText=code;if(expiry)expiry.innerText='For '+physicianName+' · Expires '+formatWorkflowTime(expiresAt);if(outlook)outlook.classList.toggle('hidden',!email);try{navigator.clipboard.writeText(code);}catch(e){}}
function sendLastAccessCodeViaOutlook(){const info=rotasticLastIssuedAccessCode;if(!info||!info.code||!info.email){alert('Generate a code for a physician with a saved PHCC email first.');return;}const firstTime=info.kind==='first_time';const subject=firstTime?'Rotastic activation code':'ROTASTIC Admin View access code';const body=firstTime?('Dear '+info.physicianName+',\\n\\nYour ROTASTIC first-time setup code is: '+info.code+'\\n\\nThis code expires '+formatWorkflowTime(info.expiresAt)+'.\\n\\nOpen ROTASTIC and enter your PHCC email and this code to complete setup.\\n\\nRegards,\\nDr Zaid'):('Dear '+info.physicianName+',\\n\\nYour temporary ROTASTIC Admin View code is: '+info.code+'\\n\\nThis code expires '+formatWorkflowTime(info.expiresAt)+'.\\n\\nOpen ROTASTIC and enter this code under Temporary Administration Access.\\n\\nRegards,\\nDr Zaid');window.location.href='mailto:'+encodeURIComponent(info.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);}
async function createSelectedAccessCode(){if(!canManageAdminAccess()){alert('Access codes can only be created from an unlocked permanent Admin View.');return;}const kind=document.getElementById('accessCodeType')?.value||'first_time';const physicianName=String(document.getElementById('accessCodeDoctorSelect')?.value||'').trim();if(!physicianName){alert('Select a physician first.');return;}const email=rotasticAccessCodeEmailForDoctor(physicianName);if(!email||!/@phcc\\.gov\\.qa$/i.test(email)){alert('No PHCC email is saved for '+physicianName+'.');return;}try{await rotasticBackendEnsureSession();if(!rotasticBackendClient||!rotasticBackendUser)throw new Error('Verified Admin sign-in is required.');if(kind==='first_time'){const result=await rotasticBackendClient.functions.invoke('rotastic-registration-admin',{body:{action:'generate',email:email,physician_name:physicianName,valid_minutes:1440}});if(result.error)throw result.error;const row=result.data||{};const code=String(row.registration_code||'');if(!/^\\d{6}$/.test(code))throw new Error(row.error||'The registration service did not return a valid setup code.');showIssuedAccessCode('first_time',physicianName,email,code,row.expires_at);}else{const minutes=parseInt(document.getElementById('tempAdminDurationMinutes')?.value||'480',10);const result=await rotasticBackendClient.rpc('rotastic_issue_admin_access_code',{p_minutes:Math.max(5,minutes||480),p_target_physician:physicianName});if(result.error)throw result.error;const row=Array.isArray(result.data)?result.data[0]:result.data;const code=String(row?.admin_code||'');if(!/^\\d{8}$/.test(code))throw new Error('The Admin access service did not return a valid code.');showIssuedAccessCode('admin',physicianName,email,code,row.expires_at);await renderTempAdminCodeManager();}}catch(e){alert(e?.message||'Could not create this access code.');}}
async function createTemporaryAdminCode(){const mode=document.getElementById('accessCodeType');if(mode)mode.value='admin';onAccessCodeTypeChange();return createSelectedAccessCode();}

async function revokeTemporaryAdminCode'''
          s=fn_pattern.sub(new_fn,s,count=1)
          marker="  const canManageCodes = canManageAdminAccess();\n  card.classList.toggle('hidden', !canManageCodes);\n  if (!canManageCodes) return;"
          if s.count(marker)!=1: raise SystemExit('Expected one render manager marker; aborting.')
          s=s.replace(marker,marker+"\n\n  populateAccessCodeDoctorSelect();\n  onAccessCodeTypeChange();",1)
          p.write_text(s)
          PY
      - name: Guard the patch
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q 'id="accessCodeType"' index.html
          grep -q 'id="accessCodeDoctorSelect"' index.html
          grep -q 'sendLastAccessCodeViaOutlook' index.html
          grep -q "functions.invoke('rotastic-registration-admin'" index.html
          grep -q 'p_target_physician:physicianName' index.html
          ! git diff -- index.html | grep -E '^[+-].*<(style|link|body|main|nav|script src)' || (echo 'Unexpected global design/runtime markup change' && exit 1)
      - name: Commit unified access-code card
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add unified physician access code card'
          git push origin HEAD:main
