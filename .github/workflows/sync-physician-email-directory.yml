name: Sync physician email directory from secure backend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-physician-email-directory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch physician email lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'async function rotasticRefreshPhysicianEmailDirectory()' not in s:
              marker = 'function populateAccessCodeDoctorSelect() {'
              if marker not in s:
                  raise SystemExit('Access-code doctor selector not found')
              helper = r'''async function rotasticRefreshPhysicianEmailDirectory() {
  try {
    await rotasticBackendEnsureSession();
    if (!rotasticBackendClient?.rpc) return;
    const result = await rotasticBackendClient.rpc('rotastic_list_authorized_physicians');
    if (result?.error) throw result.error;
    const rows = Array.isArray(result?.data) ? result.data : [];
    const directory = Storage.getJSON('rotastic_physician_email_directory', {}) || {};
    const fullNames = (typeof ROTASTIC_FULL_DOCTOR_NAMES === 'object' && ROTASTIC_FULL_DOCTOR_NAMES) ? ROTASTIC_FULL_DOCTOR_NAMES : {};
    rows.forEach(function(row) {
      const physicianName = String(row?.physician_name || '').trim();
      const email = String(row?.email || '').trim().toLowerCase();
      if (!physicianName || !email) return;
      directory[physicianName] = email;
      Object.keys(fullNames).forEach(function(shortName) {
        if (String(fullNames[shortName] || '').trim().toLowerCase() === physicianName.toLowerCase()) directory[shortName] = email;
      });
    });
    Storage.setJSON('rotastic_physician_email_directory', directory);
  } catch (e) {
    console.warn('ROTASTIC physician email directory refresh failed.', e?.message || e);
  }
}

'''
              s = s.replace(marker, helper + marker, 1)

          if "rotasticRefreshPhysicianEmailDirectory();" not in s:
              pattern = re.compile(r"(function populateAccessCodeDoctorSelect\(\) \{.*?if \(current\) select\.value = current;)(\n\})", re.S)
              s, count = pattern.subn(r"\1\n  rotasticRefreshPhysicianEmailDirectory();\2", s, count=1)
              if count != 1:
                  raise SystemExit('Could not attach secure email refresh to selector')

          lookup_anchor = "  const stored = String(map[docName] || '').trim().toLowerCase();\n  if (stored) return stored;"
          lookup_insert = lookup_anchor + "\n  try {\n    const secureDirectory = Storage.getJSON('rotastic_physician_email_directory', {});\n    const secureStored = String((secureDirectory && secureDirectory[docName]) || '').trim().toLowerCase();\n    if (secureStored) return secureStored;\n  } catch (e) {}"
          if "const secureDirectory = Storage.getJSON('rotastic_physician_email_directory'" not in s:
              if lookup_anchor not in s:
                  raise SystemExit('Physician email lookup anchor not found')
              s = s.replace(lookup_anchor, lookup_insert, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r"const CACHE = 'rotastic-v\d+[^']*';", "const CACHE = 'rotastic-v235-secure-email-directory';", w, count=1)
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -q "rotasticRefreshPhysicianEmailDirectory" index.html
          grep -q "rotastic_list_authorized_physicians" index.html
          grep -q "rotastic_physician_email_directory" index.html
          grep -q "rotastic-v235-secure-email-directory" service-worker.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Load physician emails from secure backend'
          git push origin HEAD:main
