name: Restore normal tabs and personal poster
on:
  push:
    paths:
      - '.github/workflows/restore-personal-poster.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore profile-ready personal landing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "if (typeof isAdminViewActive === 'function' && isAdminViewActive()) return;\n      forcePersonalViewLanding();\n      ensurePersonalViewHasContent();"
          new = "if (!activeUserDocName) return;\n      forcePersonalViewLanding();\n      ensurePersonalViewHasContent();"
          if old not in s:
              raise SystemExit('target personal landing block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify targeted change
        run: |
          grep -n "if (!activeUserDocName) return" index.html | tail -5
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore bottom tabs without removing personal poster'
          git push origin HEAD:main
