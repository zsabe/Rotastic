name: Inspect poster and splash source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-poster.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect relevant source
        run: |
          echo '=== poster render references ==='
          grep -niE 'personal-poster|myshift|my-shift|You.?re Off|You Are Off|YOU ARE OFF' index.html | tail -160 || true
          echo '=== render area ==='
          sed -n '12680,12920p' index.html
          echo '=== late startup ==='
          sed -n '25420,25520p' index.html
