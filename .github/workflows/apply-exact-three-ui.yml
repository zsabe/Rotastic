name: Apply exact three UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply exact requested three UI changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch from exact original
        run: |
          git checkout 80a30db853656cb21c7a730ff7c54836ca5e43c9 -- index.html
          python3 .github/scripts/apply_exact_three_ui.py
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply exact requested three UI changes"
          git pull --rebase origin main
          git push origin HEAD:main
