name: Inspect UI targets v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['live-rota-meta-row','driveTimeBtn','weatherBadge','topActionGrid','rotaExportToggleBtn','rotaExportActions','You are off today','personalPoster','personal-poster','personalDuty']
          out=[]
          for n in needles:
              out.append('\n===== '+n+' =====\n')
              pos=0; count=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  count+=1
                  out.append(s[max(0,i-1200):min(len(s),i+2200)]+'\n---\n')
                  pos=i+len(n)
                  if count>=3: break
              if count==0: out.append('NOT FOUND\n')
          Path('ui-targets-v2.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-targets-v2.txt
          git commit -m "Write UI targets v2 inspection"
          git push
