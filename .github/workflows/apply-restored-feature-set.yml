name: Apply restored ROTASTIC feature set
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply restored feature set') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply direct feature patch
        run: python .github/scripts/apply_restored_feature_set.py
      - name: Verify design and JavaScript
        shell: bash
        run: |
          git diff --check
          grep -q 'You are off today' index.html
          grep -q 'tickerContent' index.html
          grep -q 'personal-poster-card' index.html
          grep -q 'notificationBellBtn' index.html
          grep -q 'rotasticGenerationRange' index.html
          grep -q 'moursiApprovalInboxCard' index.html
          grep -q 'rotastic_issue_registration_code_v2' index.html
          grep -q 'rotasticAvailableDoctorCountForDay' index.html
          ! grep -q 'deskTabBtnFeedback' index.html
          ! grep -q 'Delegated Admin View' index.html
          ! grep -q 'Clinical Lead — Add / Change Shift' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="rotastic-requested-direct-functions">([\s\S]*?)</script>',s)
          if not m: raise SystemExit('direct feature script not found')
          Path('/tmp/rotastic-direct.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/rotastic-direct.js
      - name: Commit feature set
        run: |
          if git diff --quiet -- index.html; then
            echo 'Feature set already applied.'
            exit 0
          fi
          git config user.name 'zsabe'
          git config user.email 'zaidsabe@gmail.com'
          git add index.html
          git commit -m 'Apply restored feature set without redesign'
          git push
