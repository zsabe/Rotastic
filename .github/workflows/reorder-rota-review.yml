name: Reorder Rota Review
on:
  push:
    paths:
      - '.github/workflows/reorder-rota-review.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Rota Review above Automatic Rota Rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='rotastic-review-before-auto-rules-v1'
          if marker in s:
              raise SystemExit(0)
          patch='''\n<script id="rotastic-review-before-auto-rules-v1">\n(function(){\n  function text(el){return String(el&&el.textContent||'').replace(/\\s+/g,' ').trim();}\n  function moveReview(){\n    var headings=Array.from(document.querySelectorAll('h3'));\n    var reviewHeading=headings.find(function(h){return text(h).indexOf('Rota Review & Approval')!==-1;});\n    var rulesHeading=headings.find(function(h){return text(h).indexOf('Automatic Rota Rules')!==-1;});\n    if(!reviewHeading||!rulesHeading)return;\n    var review=reviewHeading.closest('.clean-card');\n    var rules=rulesHeading.closest('.clean-card');\n    if(review&&rules&&rules.parentNode&&review!==rules.previousElementSibling){rules.parentNode.insertBefore(review,rules);}\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',moveReview);else moveReview();\n})();\n</script>\n'''
          if '</body>' not in s: raise SystemExit('body anchor missing')
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit surgical reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move Rota Review above Automatic Rota Rules"
          git push
