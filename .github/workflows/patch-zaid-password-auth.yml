name: Patch Dr Zaid password auth

on:
  push:
    paths:
      - '.github/workflows/patch-zaid-password-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Replace magic-link auth with password auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old = '''      // Establish a real Supabase Auth session for permanent-admin RPCs.
      // This does not change any UI; it only sends a one-time PHCC magic link
      // when this device does not already hold Dr Zaid's authenticated session.
      try {
        await rotasticBackendEnsureSession();
        const currentSession = await rotasticBackendClient?.auth?.getSession();
        const currentEmail = String(currentSession?.data?.session?.user?.email || '').trim().toLowerCase();
        if (currentEmail !== ROTASTIC_ZAID_PERMANENT_EMAIL) {
          const authResult = await rotasticBackendClient.auth.signInWithOtp({
            email: ROTASTIC_ZAID_PERMANENT_EMAIL,
            options: {
              emailRedirectTo: window.location.origin + window.location.pathname,
              shouldCreateUser: true
            }
          });
          if (authResult?.error) throw authResult.error;
          rotasticRegistrationSetStatus('Check your PHCC email once to authenticate permanent Admin View.', true);
        }
      } catch (authError) {
        console.warn('ROTASTIC: permanent admin Supabase sign-in could not start.', authError?.message || authError);
      }
'''

          new = '''      // Establish Dr Zaid's real Supabase Auth session without email OTP/magic links.
      // The password is entered only when needed and is never written to ROTASTIC storage or source.
      try {
        await rotasticBackendEnsureSession();
        const currentSession = await rotasticBackendClient?.auth?.getSession();
        const currentEmail = String(currentSession?.data?.session?.user?.email || '').trim().toLowerCase();
        if (currentEmail !== ROTASTIC_ZAID_PERMANENT_EMAIL) {
          const adminPassword = window.prompt('Enter Dr Zaid backend admin password');
          if (adminPassword) {
            const authResult = await rotasticBackendClient.auth.signInWithPassword({
              email: ROTASTIC_ZAID_PERMANENT_EMAIL,
              password: adminPassword
            });
            if (authResult?.error) throw authResult.error;
            rotasticBackendUser = authResult?.data?.user || authResult?.data?.session?.user || null;
            if (!rotasticBackendUser) throw new Error('Authenticated admin session was not created.');
            await rotasticFinishAuthenticatedRegistration();
            rotasticRegistrationSetStatus('Permanent backend Admin View authenticated.', true);
          } else {
            rotasticRegistrationSetStatus('Owner access active. Backend admin authentication not completed.', true);
          }
        } else {
          rotasticBackendUser = currentSession?.data?.session?.user || rotasticBackendUser;
          rotasticRegistrationSetStatus('Permanent backend Admin View authenticated.', true);
        }
      } catch (authError) {
        console.warn('ROTASTIC: permanent admin password sign-in failed.', authError?.message || authError);
        rotasticRegistrationSetStatus(authError?.message || 'Backend admin authentication failed.', false);
      }
'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one magic-link auth block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Guard runtime diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          ! git diff -- index.html | grep -E '^[+-].*<(style|link|body|main|nav|div|section|button|select|textarea)' || (echo 'Unexpected UI/layout diff' && exit 1)
          git diff -- index.html | grep -q 'signInWithPassword'
          ! git diff -- index.html | grep -q 'signInWithOtp'

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use password auth for Dr Zaid admin session'
          git push origin HEAD:main
