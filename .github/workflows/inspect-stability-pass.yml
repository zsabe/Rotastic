name: Inspect stability pass targets

on:
  push:
    paths:
      - '.github/workflows/inspect-stability-pass.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract focused handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          def body(name, span=130):
            pats=[f'function {name}',f'async function {name}',f'const {name} =',f'let {name} =',f'var {name} =']
            hits=[s.find(p) for p in pats if s.find(p)>=0]
            i=min(hits) if hits else -1
            if i<0:return f'-- {name}: not found --\n'
            line=s[:i].count('\n'); a=max(0,line-8); b=min(len(lines),line+span)
            return '\n'.join(f'{n+1}: {lines[n]}' for n in range(a,b))+'\n'
          groups={
            'tmp-view.txt':['isCurrentUserAdmin','isAdminViewActive','canManageAdminAccess','applyViewMode','handleViewBadgeClick','openAdminModal','closeAdminModal','verifyAdminPasskey','rotasticSafeApplyViewMode','forcePersonalViewLanding'],
            'tmp-notifs.txt':['rotasticBackendHydrateNotifications','rotasticBackendMarkNotificationRead','showNotificationsForCurrentUser','queueInAppNotification','notifyRecipient','rotasticUpdateNotificationPermissionUI','sendBrowserNotification'],
            'tmp-announcements.txt':['canViewAnnouncements','canBroadcastAnnouncements','renderAnnouncementAdminView','broadcastAdminAnnouncement','buildAnnouncementCarouselItems','playAnnouncementCarousel'],
            'tmp-metrics.txt':['buildMetricsSummary','renderMetricsView','renderMetricsTable','populateMetricsDoctorFilter','renderMetricsCharts','renderIndividualDoctorMetrics','exportAdminMetricsInfographic','printMetricsInfographic'],
            'tmp-auth.txt':['rotasticRegisterWithAdminCode','rotasticApplyVerifiedIdentity','rotasticInitializeVerifiedRegistration','rotasticBackendEnsureSession'],
            'tmp-access.txt':['createSelectedAccessCode','populateAccessCodeDoctorSelect','getKnownPhysicianEmail','rotasticAccessCodeEmailForDoctor','sendLastAccessCodeViaOutlook']
          }
          for path,names in groups.items(): Path(path).write_text('\n\n'.join(body(x) for x in names),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-view.txt tmp-notifs.txt tmp-announcements.txt tmp-metrics.txt tmp-auth.txt tmp-access.txt
          git commit -m 'Refresh focused stability inspection context'
          git push origin HEAD:main
