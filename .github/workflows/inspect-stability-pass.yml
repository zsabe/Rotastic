name: Apply ROTASTIC stability UI

on:
  push:
    paths:
      - '.github/workflows/inspect-stability-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Load stability UI and refresh PWA cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script id="rotastic-stability-ui" src="./stability-ui.js?v=20261026-1" defer></script>'
          if 'id="rotastic-stability-ui"' not in s:
              i=s.lower().rfind('</body>')
              if i<0: raise SystemExit('closing body not found')
              s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js'); w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE\s*=\s*'[^']+';", "const CACHE = 'rotastic-v239-stability-ui';", w, count=1)
          if "'./stability-ui.js'" not in w:
              marker="  './admin-comms-ui.js',"
              if marker in w:w=w.replace(marker,marker+"\n  './stability-ui.js',",1)
              else: raise SystemExit('service worker CORE anchor missing')
          sw.write_text(w,encoding='utf-8')
          PY
          node --check stability-ui.js
          git diff --check
          grep -q 'rotastic-stability-ui' index.html
          grep -q 'rotastic-v239-stability-ui' service-worker.js
      - name: Audit inline button handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sources='\n'.join(Path(x).read_text(encoding='utf-8') for x in ['index.html','generate-cleanup.js','stability-ui.js'] if Path(x).exists())
          html=Path('index.html').read_text(encoding='utf-8')
          calls=[]
          for m in re.finditer(r'onclick\s*=\s*["\']\s*([A-Za-z_$][\w$]*)\s*\(',html,re.I): calls.append(m.group(1))
          ignore={'alert','confirm','prompt','window','document','history'}
          missing=[]
          for fn in sorted(set(calls)):
              if fn in ignore: continue
              patterns=[rf'function\s+{re.escape(fn)}\s*\(',rf'(?:const|let|var)\s+{re.escape(fn)}\s*=',rf'window\.{re.escape(fn)}\s*=']
              if not any(re.search(p,sources) for p in patterns): missing.append(fn)
          print('Inline handlers:',len(set(calls)),'Missing:',missing)
          if missing: raise SystemExit('Undefined inline handlers: '+', '.join(missing))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Load stability UI and verify button handlers'
          git push origin HEAD:main
