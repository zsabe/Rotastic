name: Inspect announcements
on:
  push:
    paths:
      - '.github/workflows/inspect-announcements.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find announcement code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(errors='ignore').splitlines()
          keys=('announcement','prayer','adhan','diabetes','obesity','ticker','medical fact','cpd')
          hits=[]
          for i,line in enumerate(s,1):
              low=line.lower()
              if any(k in low for k in keys):
                  hits.append(i)
          for i in hits:
              a=max(1,i-8); b=min(len(s),i+18)
              print(f'\n===== LINES {a}-{b} (hit {i}) =====')
              for n in range(a,b+1):
                  print(f'{n}: {s[n-1]}')
          print(f'\nTOTAL_LINES={len(s)} HITS={hits}')
          PY