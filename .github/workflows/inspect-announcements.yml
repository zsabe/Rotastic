name: Inspect announcements
on:
  push:
    paths:
      - '.github/workflows/inspect-announcements.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate announcement definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text().splitlines()
          terms=['announcement','prayer','diabetes','obesity','headline','ticker','adhan','salah','cpd']
          hits=[]
          for i,line in enumerate(lines,1):
            if any(t in line.lower() for t in terms): hits.append(i)
          print('HITS', hits)
          for i in hits:
            print(f'{i}: {lines[i-1][:500]}')
          PY