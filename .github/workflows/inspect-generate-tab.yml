name: Run reminder integration patch

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply and verify
        shell: bash
        run: |
          python patch-reminder.py
          node --check generate-cleanup.js
          grep -q 'scheduleBackendShiftReminders' generate-cleanup.js
          grep -q 'rotastic_schedule_shift_reminders' generate-cleanup.js
          git diff --check
          git rm patch-reminder.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generate-cleanup.js tmp-shift-context.txt
          git commit -m 'Queue one-hour reminders from rota changes'
          git push origin HEAD:main
