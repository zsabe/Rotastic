name: Apply Generate cleanup loader

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch app entry and cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Day total ${dayLeaveCount}','Day total ${rotasticAvailableDoctorCountForDay(s)}')
          s=s.replace('Fathjelalim','Fathielalim')
          tag='<script id="rotastic-generate-cleanup" src="./generate-cleanup.js?v=20261026-1" defer></script>'
          if 'id="rotastic-generate-cleanup"' not in s:
              i=s.lower().rfind('</body>')
              if i<0: raise SystemExit('closing body not found')
              s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE\s*=\s*'[^']+';", "const CACHE = 'rotastic-v237-generate-cleanup';", w, count=1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          git diff --check
          grep -q 'rotastic-generate-cleanup' index.html
          grep -q 'rotasticAvailableDoctorCountForDay' index.html
          grep -q 'rotastic-v237-generate-cleanup' service-worker.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Load Generate cleanup and fix rota day totals'
          git push origin HEAD:main
