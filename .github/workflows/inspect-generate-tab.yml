name: Wire backend shift reminders

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch reminder queue integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('generate-cleanup.js')
          s=p.read_text(encoding='utf-8')
          anchor="function addDays(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}\n"
          block=r'''
async function scheduleBackendShiftReminders(schedule){
  if(!window.rotasticBackendClient||!Array.isArray(schedule)||!schedule.length)return;
  try{
    if(typeof rotasticBackendEnsureSession==='function')await rotasticBackendEnsureSession();
    const days=schedule.filter(d=>d&&d.isoDate),dates=[...new Set(days.map(d=>d.isoDate))],items=[];
    days.forEach(day=>['am','pm'].forEach(period=>{
      const sh=day[period]||{};let doctors=[];
      try{doctors=typeof rotasticCollectShiftDoctors==='function'?rotasticCollectShiftDoctors(day,period):[]}catch(e){}
      const seen=new Set();
      doctors.forEach(name=>{
        name=String(name||'').trim();if(!name)return;
        const ck=(typeof canonicalRotaName==='function'?canonicalRotaName(name):name).toLowerCase();if(seen.has(ck))return;seen.add(ck);
        try{if(typeof rotasticDoctorIsOnDisplayedLeave==='function'&&rotasticDoctorIsOnDisplayedLeave(name,day))return}catch(e){}
        const timed=(typeof doctorMatches==='function')&&(doctorMatches(sh.timed1Doc,name)||doctorMatches(sh.timed2Doc,name));
        const start=timed?(period==='am'?540:840):(period==='am'?420:960),rem=start-60,hh=String(Math.floor(rem/60)).padStart(2,'0'),mm=String(rem%60).padStart(2,'0');
        const scheduled=day.isoDate+'T'+hh+':'+mm+':00+03:00';if(new Date(scheduled).getTime()<=Date.now())return;
        const shiftLabel=timed?(period==='am'?'09:00–16:00':'14:00–20:00'):(period==='am'?'07:00–14:00':'16:00–22:00');
        items.push({recipient_name:name,title:'Shift starts in 1 hour',message:'Your '+shiftLabel+' ROTASTIC shift starts in about 1 hour.',scheduled_for:scheduled,dedupe_key:'shift-reminder|'+day.isoDate+'|'+period+'|'+ck+'|'+start,metadata:{schedule_date:day.isoDate,period:period,shift_label:shiftLabel,start_minutes:start}});
      });
    }));
    for(let i=0;i<items.length||i===0;i+=400){
      const chunk=items.slice(i,i+400);const r=await rotasticBackendClient.rpc('rotastic_schedule_shift_reminders',{p_items:chunk,p_dates:i===0?dates:[]});
      if(r.error)throw r.error;if(items.length===0)break;
    }
  }catch(e){console.warn('Backend shift reminders:',e)}
}
'''
          if 'async function scheduleBackendShiftReminders' not in s:
              if anchor not in s: raise SystemExit('addDays anchor missing')
              s=s.replace(anchor,anchor+block,1)
          old="if(weeks===1)return originalPlanner.apply(this,arguments);"
          new="if(weeks===1){const result=await originalPlanner.apply(this,arguments);await scheduleBackendShiftReminders(currentSchedule);return result;}"
          if old in s:s=s.replace(old,new,1)
          old2="switchTab('schedule');renderScheduleView();return true;"
          new2="await scheduleBackendShiftReminders(series.flatMap(x=>x.schedule||[]));switchTab('schedule');renderScheduleView();return true;"
          if old2 in s:s=s.replace(old2,new2,1)
          old3="const originalAuto=typeof generateAutomaticWeeklyDraftIfDue==='function'?generateAutomaticWeeklyDraftIfDue:null;if(originalAuto)generateAutomaticWeeklyDraftIfDue=async function(){try{const d=getMostRecentWednesday2200Qatar();if(d?.key==='2026-10-28'){renderAutoGenerationStatus();return false}}catch(e){}return originalAuto.apply(this,arguments)};"
          new3="const originalAuto=typeof generateAutomaticWeeklyDraftIfDue==='function'?generateAutomaticWeeklyDraftIfDue:null;if(originalAuto)generateAutomaticWeeklyDraftIfDue=async function(){try{const d=getMostRecentWednesday2200Qatar();if(d?.key==='2026-10-28'){renderAutoGenerationStatus();return false}}catch(e){}const result=await originalAuto.apply(this,arguments);if(result)await scheduleBackendShiftReminders(currentSchedule);return result;};"
          if old3 in s:s=s.replace(old3,new3,1)
          confirm_anchor="const originalAuto=typeof generateAutomaticWeeklyDraftIfDue"
          confirm_block="const originalConfirmAmendment=typeof confirmScheduleAmendment==='function'?confirmScheduleAmendment:null;if(originalConfirmAmendment)confirmScheduleAmendment=function(){const r=originalConfirmAmendment.apply(this,arguments);Promise.resolve(r).then(()=>scheduleBackendShiftReminders(currentSchedule));return r;};\n\n"
          if 'originalConfirmAmendment' not in s:
              if confirm_anchor not in s: raise SystemExit('auto anchor missing')
              s=s.replace(confirm_anchor,confirm_block+confirm_anchor,1)
          p.write_text(s,encoding='utf-8')
          Path('tmp-shift-context.txt').unlink(missing_ok=True)
          PY
          node --check generate-cleanup.js
      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'scheduleBackendShiftReminders' generate-cleanup.js
          grep -q 'rotastic_schedule_shift_reminders' generate-cleanup.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generate-cleanup.js tmp-shift-context.txt
          git commit -m 'Queue one-hour reminders from rota changes'
          git push origin HEAD:main
