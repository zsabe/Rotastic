name: Refresh Generate cleanup cache

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Bump service worker cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8').replace("const CACHE = 'rotastic-v237-generate-cleanup';","const CACHE = 'rotastic-v238-generate-cleanup-reminders';",1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'rotastic-v238-generate-cleanup-reminders' service-worker.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js
          git commit -m 'Refresh PWA cache for Generate cleanup'
          git push origin HEAD:main
