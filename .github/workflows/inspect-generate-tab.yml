name: Inspect generate tab

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show target functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          names=['analyseScheduleAmendment','addSmartRotaRule','applyMoursiShiftOverride','renderPhysicianManagement','generateDutyScheduleFromPlanner','rotasticRefreshGenerationLock','getCurrentUserShiftWindow']
          for name in names:
            hits=[i for i,l in enumerate(lines) if name.lower() in l.lower()]
            for i in hits[:5]:
              a=max(0,i-8); b=min(len(lines),i+90)
              print(f'--- {name} lines {a+1}-{b} ---')
              for n in range(a,b):
                line=re.sub(r'(?i)(sb_secret_[A-Za-z0-9_\-]+)', '[secret-redacted]', lines[n])
                print(f'{n+1}: {line}')
          for term in ['day total','available doctors','availableDoctors','shift reminder','one hour','60 * 60','60*60','auto_generation_last_wednesday','22:00']:
            for i,l in enumerate(lines):
              if term.lower() in l.lower():
                a=max(0,i-8); b=min(len(lines),i+35)
                print(f'--- term {term} lines {a+1}-{b} ---')
                for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
