name: Verify Generate cleanup

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cleanup module
        shell: bash
        run: |
          node --check generate-cleanup.js
          grep -q 'rotastic-generate-cleanup' index.html
          grep -q 'Day total ${rotasticAvailableDoctorCountForDay(s)}' index.html
          grep -q '2026-10-28' generate-cleanup.js
          grep -q 'rotasticGenerationRange' generate-cleanup.js
          grep -q 'rotastic_list_authorized_physicians' generate-cleanup.js
