name: Inspect shift timing helper

on:
  push:
    paths:
      - '.github/workflows/inspect-generate-tab.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract shift helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          key='function getCurrentUserShiftWindow'
          i=s.find(key)
          if i<0: raise SystemExit('helper not found')
          b=s.find('{',i); depth=0; end=None
          for n in range(b,len(s)):
            if s[n]=='{': depth+=1
            elif s[n]=='}':
              depth-=1
              if depth==0:
                end=n+1; break
          if end is None: raise SystemExit('helper end not found')
          Path('tmp-shift-context.txt').write_text(s[i:end],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-shift-context.txt
          git commit -m 'Temporary shift timing inspection'
          git push origin HEAD:main
