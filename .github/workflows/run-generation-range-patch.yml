name: Run safe generation range patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-generation-range-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/wire-generation-range.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/run-generation-range-patch.yml scripts/wire-generation-range.py
          git commit -m 'Make generation range selector functional without redesign'
          git push
