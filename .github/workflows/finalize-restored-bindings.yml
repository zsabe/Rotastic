name: Finalize restored feature bindings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize restored feature bindings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Correct restored top-level bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          replacements={
            "const docs=Array.isArray(window.DOCTORS)?window.DOCTORS:[];":"const docs=(typeof DOCTORS!=='undefined'&&Array.isArray(DOCTORS))?DOCTORS:(Array.isArray(window.DOCTORS)?window.DOCTORS:[]);",
            "if(!window.rotasticBackendClient)return map;":"if(typeof rotasticBackendClient==='undefined'||!rotasticBackendClient)return map;",
            "const full=window.ROTASTIC_FULL_DOCTOR_NAMES||{};":"const full=(typeof ROTASTIC_FULL_DOCTOR_NAMES!=='undefined'&&ROTASTIC_FULL_DOCTOR_NAMES)?ROTASTIC_FULL_DOCTOR_NAMES:(window.ROTASTIC_FULL_DOCTOR_NAMES||{});",
            "if(!window.rotasticBackendClient||!window.rotasticBackendUser)throw new Error('Verified Admin sign-in is required.');":"if(typeof rotasticBackendClient==='undefined'||!rotasticBackendClient||typeof rotasticBackendUser==='undefined'||!rotasticBackendUser)throw new Error('Verified Admin sign-in is required.');",
            "if(window.rotasticBackendClient?.auth)await rotasticBackendClient.auth.signOut({scope:'local'});":"if(typeof rotasticBackendClient!=='undefined'&&rotasticBackendClient?.auth)await rotasticBackendClient.auth.signOut({scope:'local'});",
            "const name=String(window.activeUserDocName||Storage.get('rotastic_user_doc_name','')||'').trim();":"const name=String((typeof activeUserDocName!=='undefined'&&activeUserDocName)||Storage.get('rotastic_user_doc_name','')||'').trim();",
            "const me=String(window.activeUserDocName||'').trim(),r=String(n?.recipient||n?.recipient_name||'').trim();":"const me=String((typeof activeUserDocName!=='undefined'&&activeUserDocName)||Storage.get('rotastic_user_doc_name','')||'').trim(),r=String(n?.recipient||n?.recipient_name||'').trim();",
            "if(window.rotasticBackendClient&&window.rotasticBackendUser)await rotasticBackendClient.rpc('rotastic_cleanup_my_notifications')":"if(typeof rotasticBackendClient!=='undefined'&&rotasticBackendClient&&typeof rotasticBackendUser!=='undefined'&&rotasticBackendUser)await rotasticBackendClient.rpc('rotastic_cleanup_my_notifications')",
            "const isM=/moursi|morsi/i.test(String(window.activeUserDocName||''))||role==='moursi';":"const isM=/moursi|morsi/i.test(String((typeof activeUserDocName!=='undefined'&&activeUserDocName)||''))||role==='moursi';",
            "if(!host||!Array.isArray(window.currentSchedule)||!currentSchedule.length)return;":"if(!host||typeof currentSchedule==='undefined'||!Array.isArray(currentSchedule)||!currentSchedule.length)return;",
            "const idx=typeof window.activeDayIndex==='number'&&activeDayIndex>=0?activeDayIndex:0":"const idx=typeof activeDayIndex==='number'&&activeDayIndex>=0?activeDayIndex:0",
            "if(!window.rotasticBackendClient||!window.rotasticBackendUser||!Array.isArray(schedule))return;":"if(typeof rotasticBackendClient==='undefined'||!rotasticBackendClient||typeof rotasticBackendUser==='undefined'||!rotasticBackendUser||!Array.isArray(schedule))return;",
            "window.currentSchedule||[]":"(typeof currentSchedule!=='undefined'?currentSchedule:[])"
          }
          for a,b in replacements.items():
            if a not in s:
              raise SystemExit('Required binding anchor missing: '+a[:80])
            s=s.replace(a,b)
          boot="function boot(){refreshSettingsIdentity();updateBell();refreshSecureDirectory();renderRotaDayHeader();renderMoursiInbox();shrinkCredits();setInterval(()=>{updateBell();refreshSettingsIdentity()},60000);}"
          boot2="function boot(){try{const q=Storage.getJSON('rotastic_notification_queue',[])||[],cut=Date.now()-3*24*60*60*1000;Storage.setJSON('rotastic_notification_queue',q.filter(n=>{const t=new Date(n?.createdAt||n?.created_at||0).getTime();return !t||t>=cut;}));if(typeof rotasticBackendClient!=='undefined'&&rotasticBackendClient&&typeof rotasticBackendUser!=='undefined'&&rotasticBackendUser)rotasticBackendClient.rpc('rotastic_cleanup_my_notifications').catch(()=>{});}catch(e){}refreshSettingsIdentity();updateBell();refreshSecureDirectory();renderRotaDayHeader();renderMoursiInbox();shrinkCredits();setInterval(()=>{updateBell();refreshSettingsIdentity()},60000);}"
          if boot not in s:
            raise SystemExit('Notification pruning boot anchor missing')
          s=s.replace(boot,boot2,1)
          if s==old:
            raise SystemExit('No binding changes made')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify syntax and restored design anchors
        run: |
          git diff --check
          grep -q 'You are off today' index.html
          grep -q 'personal-poster-card' index.html
          grep -q 'tickerContent' index.html
          grep -q "typeof DOCTORS!='undefined'\|typeof DOCTORS!=='undefined'" index.html
          grep -q 'notificationBellBtn' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="rotastic-requested-direct-functions">([\s\S]*?)</script>',s)
          if not m: raise SystemExit('direct helper missing')
          Path('/tmp/direct.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/direct.js
      - name: Commit corrected bindings
        run: |
          git config user.name 'zsabe'
          git config user.email 'zaidsabe@gmail.com'
          git add index.html
          git commit -m 'Finalize restored feature bindings'
          git push
