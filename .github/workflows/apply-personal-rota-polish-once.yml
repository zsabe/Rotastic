name: Apply personal and rota polish once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted changes
        run: python .github/scripts/apply_personal_rota_polish.py
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish personal view and rota headers"
          git pull --rebase origin main
          git push origin main
