name: Apply Generate and rota cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-generate-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply requested cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('Day total ${dayLeaveCount}', 'Day total ${rotasticAvailableDoctorCountForDay(s)}')
          s = s.replace('Fathjelalim', 'Fathielalim')
          s = re.sub(r'admin-comms-ui\.js\?v=[0-9A-Za-z._-]+', 'admin-comms-ui.js?v=20261026-7', s)
          index.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          if sw.exists():
              w = sw.read_text(encoding='utf-8')
              w = re.sub(r"const CACHE\s*=\s*'[^']+';", "const CACHE = 'rotastic-v237-generate-cleanup';", w, count=1)
              sw.write_text(w, encoding='utf-8')

          ui = Path('admin-comms-ui.js')
          j = ui.read_text(encoding='utf-8')
          marker = '/* ROTASTIC_GENERATE_CLEANUP_20261026 */'
          if marker not in j:
              j += r'''

/* ROTASTIC_GENERATE_CLEANUP_20261026 */
(function(){
  'use strict';

  function qText(el){ return String(el && el.textContent || '').replace(/\s+/g,' ').trim(); }
  function headingCard(rx){
    const heads = Array.from(document.querySelectorAll('#tabGenerator h2,#tabGenerator h3,#tabGenerator h4,#tabGenerator [class*="font-bold"],#tabGenerator [class*="font-black"]'));
    const h = heads.find(el => rx.test(qText(el)));
    return h ? h.closest('.clean-card') : null;
  }

  function removeRedundantAdminBoxes(){
    document.querySelectorAll('h2,h3,h4,[class*="font-bold"],[class*="font-black"]').forEach(function(h){
      const t=qText(h);
      if (/^Delegated Admin(?: View)?$/i.test(t)) {
        const c=h.closest('.clean-card,.rac-card,.rounded-2xl'); if(c) c.remove();
      }
      if (/^Clinical Lead\s*[—-]\s*Add\s*\/\s*Change Shift$/i.test(t)) {
        const c=h.closest('.clean-card'); if(c) c.remove();
      }
    });
    Array.from(document.querySelectorAll('#tabGenerator *')).forEach(function(el){
      if (qText(el)==='Smart Rules Assistant') {
        const box=el.closest('.mt-4');
        if(box && box.querySelector('#smartRotaRuleInput')) box.remove();
      }
    });
  }

  function consolidateCoreRules(){
    const generateBtn=document.querySelector('#tabGenerator button[onclick="generateDutyScheduleFromPlanner()"]');
    const generateCard=generateBtn && generateBtn.closest('.clean-card');
    const rulesCard=headingCard(/^Automatic Rota Rules$/i);
    if(!generateCard || !rulesCard || rulesCard===generateCard || document.getElementById('rotasticCoreRulesDetails')) return;
    const details=document.createElement('details');
    details.id='rotasticCoreRulesDetails';
    details.className='mt-4 rounded-xl border border-violet-500/20 bg-violet-950/10 p-3';
    const summary=document.createElement('summary');
    summary.className='cursor-pointer text-[11px] font-black uppercase tracking-wider text-violet-300';
    summary.innerHTML='<i class="fa-solid fa-gears mr-1.5"></i>Core rota rules';
    details.appendChild(summary);
    const body=document.createElement('div');
    body.className='pt-3';
    while(rulesCard.firstChild) body.appendChild(rulesCard.firstChild);
    details.appendChild(body);
    generateCard.appendChild(details);
    rulesCard.remove();
  }

  function ensureGenerationRangeControl(){
    if(document.getElementById('rotasticGenerationRange')) return;
    const btn=document.querySelector('#tabGenerator button[onclick="generateDutyScheduleFromPlanner()"]');
    if(!btn) return;
    const holder=btn.parentElement;
    if(!holder) return;
    const wrap=document.createElement('div');
    wrap.className='mb-2';
    wrap.innerHTML='<label class="block text-[10px] font-bold uppercase tracking-wider text-teal-300 mb-1">Generate period</label><select id="rotasticGenerationRange" class="w-full bg-slate-900 text-white text-xs p-2.5 rounded-xl border border-slate-700 outline-none focus:border-teal-400"><option value="1">1 week</option><option value="4">1 month (4 weeks)</option><option value="13">3 months (13 weeks)</option></select>';
    holder.insertBefore(wrap,btn);
  }

  function addDaysISO(iso, days){
    const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+days);
    return d.toISOString().slice(0,10);
  }

  const originalGeneratePlanner = typeof generateDutyScheduleFromPlanner==='function' ? generateDutyScheduleFromPlanner : null;
  if(originalGeneratePlanner){
    generateDutyScheduleFromPlanner = async function(){
      const rangeEl=document.getElementById('rotasticGenerationRange');
      const weeks=Math.max(1,parseInt(rangeEl && rangeEl.value || '1',10)||1);
      if(weeks===1) return originalGeneratePlanner.apply(this,arguments);
      await rotasticRefreshGenerationLock();
      if(!rotasticGuardNewGeneration(true)) return false;
      const weekSelect=document.getElementById('cycleStartDate');
      const firstISO=String(weekSelect && weekSelect.value || '');
      if(!firstISO){ alert('Please choose the week commencing Sunday.'); return false; }
      const input=document.getElementById('wednesdayAMOBGroup');
      const firstGroup=typeof getWednesdayAMOBGroupValue==='function' ? getWednesdayAMOBGroupValue() : String(input && input.value || '');
      if(!firstGroup){ alert('Please select which group is on AM on Wednesday before generating the schedule.'); return false; }
      const snapshots=[];
      for(let n=0;n<weeks;n++){
        const weekISO=addDaysISO(firstISO,n*7);
        if(weekSelect) weekSelect.value=weekISO;
        Storage.set('rotastic_selected_week_commencing',weekISO);
        let group=firstGroup;
        try { if(typeof getRecommendedWednesdayAMGroupForWeek==='function') group=getRecommendedWednesdayAMGroupForWeek(weekISO)||group; } catch(e){}
        if(input) input.value=group;
        Storage.set('rotastic_wednesday_am_ob_group',group);
        Storage.set('rotastic_wednesday_am_group',group);
        generateDutySchedule();
        snapshots.push({weekStart:weekISO,wednesdayAMGroup:group,schedule:JSON.parse(JSON.stringify(currentSchedule||[]))});
      }
      Storage.setJSON('rotastic_generated_schedule_series',snapshots);
      if(snapshots.length){
        currentSchedule=JSON.parse(JSON.stringify(snapshots[0].schedule));
        if(weekSelect) weekSelect.value=snapshots[0].weekStart;
        if(input) input.value=snapshots[0].wednesdayAMGroup;
        Storage.set('rotastic_selected_week_commencing',snapshots[0].weekStart);
      }
      switchTab('schedule');
      try { renderScheduleView(); } catch(e){}
      setTimeout(rotasticEnhanceRotaNavigation,30);
      return true;
    };
  }

  window.rotasticAvailableDoctorCountForDay=function(day){
    const docs=Array.isArray(window.DOCTORS) ? window.DOCTORS : (typeof DOCTORS!=='undefined' && Array.isArray(DOCTORS) ? DOCTORS : []);
    const submissions=(typeof Storage!=='undefined' ? Storage.getJSON('rotastic_leave_submissions',[]) : []) || [];
    return docs.filter(function(d){
      const name=String(d && d.name || '').trim(); if(!name) return false;
      try { if(typeof rotasticDoctorIsOnDisplayedLeave==='function' && rotasticDoctorIsOnDisplayedLeave(name,day)) return false; } catch(e){}
      const iso=String(day && day.isoDate || '');
      if(iso && submissions.some(function(item){
        if(!item || !/approved/i.test(String(item.status||''))) return false;
        let same=false; try { same=typeof canonicalRotaName==='function' ? canonicalRotaName(item.doc)===canonicalRotaName(name) : String(item.doc||'')===name; } catch(e){ same=String(item.doc||'')===name; }
        if(!same || !item.startDate) return false;
        const end=item.endDate||item.startDate;
        return iso>=item.startDate && iso<=end;
      })) return false;
      return true;
    }).length;
  };

  function rotasticEnhanceRotaNavigation(){
    const tab=document.getElementById('tabSchedule'); if(!tab || !Array.isArray(currentSchedule) || !currentSchedule.length) return;
    let nav=document.getElementById('rotasticQuickDayNav');
    if(!nav){
      nav=document.createElement('div'); nav.id='rotasticQuickDayNav'; nav.className='rotastic-quick-day-nav no-print';
      tab.insertBefore(nav,tab.firstChild);
    }
    const idx=(typeof activeDayIndex==='number' && activeDayIndex>=0 && activeDayIndex<currentSchedule.length)?activeDayIndex:0;
    const day=currentSchedule[idx]||currentSchedule[0];
    const series=(typeof Storage!=='undefined' ? Storage.getJSON('rotastic_generated_schedule_series',[]) : [])||[];
    const weekSelect=series.length>1 ? '<select id="rotasticWeekJump" class="rotastic-week-jump">'+series.map(function(x,i){return '<option value="'+i+'"'+(String(x.weekStart)===String(document.getElementById('cycleStartDate')?.value)?' selected':'')+'>Week '+(i+1)+' · '+x.weekStart+'</option>';}).join('')+'</select>' : '';
    nav.innerHTML='<button type="button" id="rotasticPrevDay" aria-label="Previous rota day"><i class="fa-solid fa-chevron-left"></i></button><div class="rotastic-current-day"><strong>'+String(day.day||'Day')+'</strong><span>'+String(day.dateLabel||day.isoDate||'')+'</span></div><button type="button" id="rotasticNextDay" aria-label="Next rota day"><i class="fa-solid fa-chevron-right"></i></button>'+weekSelect;
    nav.querySelector('#rotasticPrevDay').onclick=function(){ const n=(idx-1+currentSchedule.length)%currentSchedule.length; filterDay(n); };
    nav.querySelector('#rotasticNextDay').onclick=function(){ const n=(idx+1)%currentSchedule.length; filterDay(n); };
    const jump=nav.querySelector('#rotasticWeekJump');
    if(jump) jump.onchange=function(){
      const snap=series[Number(this.value)]; if(!snap) return;
      currentSchedule=JSON.parse(JSON.stringify(snap.schedule||[])); activeDayIndex=0;
      const week=document.getElementById('cycleStartDate'); if(week) week.value=snap.weekStart;
      const grp=document.getElementById('wednesdayAMOBGroup'); if(grp) grp.value=snap.wednesdayAMGroup||'';
      Storage.set('rotastic_selected_week_commencing',snap.weekStart);
      renderScheduleView();
    };
    tab.querySelectorAll('.rotastic-shift-panel div,.rotastic-shift-panel span').forEach(function(el){
      const t=qText(el); if(/^Room\s*\d+\b/i.test(t) && t.length<45) el.classList.add('rotastic-readable-room');
    });
  }

  const originalRenderSchedule=typeof renderScheduleView==='function'?renderScheduleView:null;
  if(originalRenderSchedule){
    renderScheduleView=function(){ const r=originalRenderSchedule.apply(this,arguments); setTimeout(rotasticEnhanceRotaNavigation,0); return r; };
  }

  async function rotasticShowSecurePhysicianEmails(){
    const list=document.getElementById('physicianManagementList'); if(!list || !window.rotasticBackendClient) return;
    try{
      if(typeof rotasticBackendEnsureSession==='function') await rotasticBackendEnsureSession();
      const result=await rotasticBackendClient.rpc('rotastic_list_authorized_physicians');
      if(result.error || !Array.isArray(result.data)) return;
      result.data.forEach(function(rec){
        if(!rec || !rec.email || !rec.physician_name) return;
        const row=Array.from(list.children).find(function(child){ return qText(child).toLowerCase().includes(String(rec.physician_name).toLowerCase()); });
        if(!row || row.querySelector('.rotastic-physician-email')) return;
        const first=row.firstElementChild||row;
        const em=document.createElement('div'); em.className='rotastic-physician-email'; em.textContent=String(rec.email).toLowerCase(); first.appendChild(em);
      });
    }catch(e){ console.warn('Secure physician email display:',e); }
  }

  const originalRenderPhysicians=typeof renderPhysicianManagement==='function'?renderPhysicianManagement:null;
  if(originalRenderPhysicians){
    renderPhysicianManagement=function(){ const r=originalRenderPhysicians.apply(this,arguments); setTimeout(rotasticShowSecurePhysicianEmails,0); return r; };
  }

  function specialAdminShiftAction(text){
    const raw=String(text||'');
    if(!/\b(add|put|assign|place)\b/i.test(raw)) return null;
    let doctor='';
    if(/\b(moursi|morsi|mohamed\s+m)\b/i.test(raw)) doctor='Dr Mohamed M.';
    else if(/\bzaid\b/i.test(raw)) doctor='Dr Zaid SE.';
    if(!doctor) return null;
    let period='';
    if(/\b(am|morning)\b/i.test(raw)) period='am';
    else if(/\b(pm|evening|afternoon)\b/i.test(raw)) period='pm';
    if(!period) return null;
    let dayIndex=-1;
    (currentSchedule||[]).some(function(day,i){
      const names=[day.day,day.isoDate,day.dateLabel].filter(Boolean).map(String);
      if(names.some(function(x){return raw.toLowerCase().includes(x.toLowerCase());})){dayIndex=i;return true;} return false;
    });
    if(dayIndex<0) return null;
    const actor=String(activeUserDocName||'');
    if(/moursi|morsi|mohamed m/i.test(actor) && doctor!=='Dr Mohamed M.') return {denied:true,message:'Clinical Lead can use this shortcut to add himself. Dr Zaid can add either permanent admin.'};
    return {type:'rotasticAdminShiftAdd',doctor:doctor,dayIndex:dayIndex,period:period,summary:'Add '+doctor+' to '+String(currentSchedule[dayIndex].day||currentSchedule[dayIndex].isoDate)+' '+period.toUpperCase()+' shift'};
  }

  const originalApplyAmendment=typeof applyScheduleAmendmentAction==='function'?applyScheduleAmendmentAction:null;
  if(originalApplyAmendment){
    applyScheduleAmendmentAction=function(action){
      if(action && action.type==='rotasticBatch'){
        for(const a of action.actions||[]){ if(!applyScheduleAmendmentAction(a)) return false; }
        return true;
      }
      if(action && action.type==='rotasticAdminShiftAdd'){
        const day=currentSchedule && currentSchedule[action.dayIndex]; if(!day) return false;
        try { if(typeof rotasticDoctorIsOnDisplayedLeave==='function' && rotasticDoctorIsOnDisplayedLeave(action.doctor,day)) return false; } catch(e){}
        const shift=day[action.period]||(day[action.period]={});
        if(!Array.isArray(shift.noRoomDocs)) shift.noRoomDocs=[];
        let present=false;
        try { present=typeof rotasticCollectShiftDoctors==='function' && rotasticCollectShiftDoctors(day,action.period).some(function(n){return typeof doctorMatches==='function'?doctorMatches(n,action.doctor):n===action.doctor;}); } catch(e){}
        if(!present) shift.noRoomDocs.push(action.doctor);
        if(action.doctor==='Dr Mohamed M.'){
          const overrides=Storage.getJSON('rotastic_moursi_shift_overrides',{}); overrides[day.isoDate]=action.period.toUpperCase(); Storage.setJSON('rotastic_moursi_shift_overrides',overrides);
        }
        return true;
      }
      return originalApplyAmendment.apply(this,arguments);
    };
  }

  const originalAnalyse=typeof analyseScheduleAmendment==='function'?analyseScheduleAmendment:null;
  if(originalAnalyse){
    analyseScheduleAmendment=async function(){
      const input=document.getElementById('scheduleAmendmentInput');
      const raw=String(input && input.value||'').trim();
      const chunks=raw.split(/\n+|\s*;\s*/).map(function(x){return x.trim();}).filter(Boolean);
      if(chunks.length<=1){
        const special=specialAdminShiftAction(raw);
        if(!special) return originalAnalyse.apply(this,arguments);
        if(special.denied){ alert(special.message); return; }
        const scope=typeof getScheduleAmendmentScope==='function'?getScheduleAmendmentScope():'rota';
        special.scope=scope; special.requestedBy=activeUserDocName; special.requestedAt=new Date().toISOString();
        rotasticPendingScheduleAmendment=special;
        const preview=document.getElementById('scheduleAmendmentPreview');
        const summary=document.getElementById('scheduleAmendmentSummary');
        const details=document.getElementById('scheduleAmendmentDetails');
        if(summary) summary.textContent=special.summary;
        if(details) details.textContent='Scope: '+(typeof rotasticScopeLabel==='function'?rotasticScopeLabel(scope):scope)+' · nothing has been changed yet.';
        if(preview) preview.classList.remove('hidden');
        return;
      }
      if(typeof canUseScheduleAmendmentAssistant==='function' && !canUseScheduleAmendmentAssistant()){ alert('Schedule amendments are available only in authorised Admin View.'); return; }
      const scope=typeof getScheduleAmendmentScope==='function'?getScheduleAmendmentScope():'rota';
      const actions=[];
      for(const chunk of chunks){
        let sp=specialAdminShiftAction(chunk);
        if(sp && sp.denied){ alert(sp.message); return; }
        if(sp){ sp.scope=scope; actions.push(sp); continue; }
        const result=await interpretScheduleAmendment(chunk);
        if(!result || !result.ok || !result.action){ alert((result&&result.message)||('Could not safely interpret: '+chunk)); return; }
        let a=result.action; if(scope==='week' && typeof rotasticBuildWeekScopedAction==='function') a=rotasticBuildWeekScopedAction(a); a.scope=scope; actions.push(a);
      }
      const batch={type:'rotasticBatch',scope:scope,actions:actions,summary:actions.map(function(a,i){return (i+1)+'. '+(a.summary||(typeof describeScheduleAmendment==='function'?describeScheduleAmendment(a):'Amendment'));}).join('  '),requestedBy:activeUserDocName,requestedAt:new Date().toISOString()};
      rotasticPendingScheduleAmendment=batch;
      const preview=document.getElementById('scheduleAmendmentPreview');
      const summary=document.getElementById('scheduleAmendmentSummary');
      const details=document.getElementById('scheduleAmendmentDetails');
      if(summary) summary.textContent=batch.summary;
      if(details) details.textContent='Multiple instructions understood · Scope: '+(typeof rotasticScopeLabel==='function'?rotasticScopeLabel(scope):scope)+' · confirm once to apply all.';
      if(preview) preview.classList.remove('hidden');
    };
  }

  const originalAuto=typeof generateAutomaticWeeklyDraftIfDue==='function'?generateAutomaticWeeklyDraftIfDue:null;
  if(originalAuto){
    generateAutomaticWeeklyDraftIfDue=async function(){
      try{ const due=getMostRecentWednesday2200Qatar(); if(due && due.key==='2026-10-28'){ renderAutoGenerationStatus(); return false; } }catch(e){}
      return originalAuto.apply(this,arguments);
    };
  }
  const originalAutoStatus=typeof renderAutoGenerationStatus==='function'?renderAutoGenerationStatus:null;
  if(originalAutoStatus){
    renderAutoGenerationStatus=function(){
      const today=typeof getQatarTodayISO==='function'?getQatarTodayISO():'';
      if(today>='2026-10-26' && today<'2026-11-04'){
        const el=document.getElementById('autoGenerationStatus');
        if(el) el.textContent='Manual exception: no automatic rota will be generated on Wednesday 28 Oct 2026. Automatic weekly generation resumes Wednesday 4 Nov at 22:00 Qatar time.';
        return;
      }
      return originalAutoStatus.apply(this,arguments);
    };
  }

  function checkOneHourShiftReminder(){
    try{
      if(!activeUserDocName) return;
      const iso=typeof getQatarTodayISO==='function'?getQatarTodayISO():'';
      if(typeof isDoctorOnLeaveToday==='function' && isDoctorOnLeaveToday(activeUserDocName,iso)) return;
      const shift=typeof getCurrentUserShiftWindow==='function'?getCurrentUserShiftWindow():null; if(!shift) return;
      const now=typeof getQatarNowParts==='function'?getQatarNowParts():null; if(!now) return;
      const delta=shift.startMinutes-now.minutes; if(delta<58 || delta>62) return;
      const key=[iso,activeUserDocName,shift.startMinutes].join('|');
      if(Storage.get('rotastic_shift_one_hour_key','')===key) return;
      Storage.set('rotastic_shift_one_hour_key',key);
      const msg='Your '+shift.label+' shift starts in about 1 hour.'+(shift.briefing&&shift.briefing.details?' '+shift.briefing.details:'');
      if(typeof sendTargetedPush==='function') sendTargetedPush(activeUserDocName,'Shift starts in 1 hour',msg,'shift-reminder',{date:iso,shiftStartMinutes:shift.startMinutes});
      else { if(typeof queueInAppNotification==='function') queueInAppNotification(activeUserDocName,msg,'shift-reminder'); if(typeof sendBrowserNotification==='function') sendBrowserNotification('Shift starts in 1 hour',msg); }
    }catch(e){ console.warn('One-hour shift reminder:',e); }
  }

  function makeDeveloperCreditSmaller(){
    document.querySelectorAll('body *').forEach(function(el){
      if(el.children.length<=2 && /Developed by\s+Dr\.\s*Zaid Sabe Eleish/i.test(qText(el))) el.style.fontSize='8px';
    });
  }

  function tuneAmendmentCopy(){
    const card=document.getElementById('scheduleAmendmentAssistantCard');
    if(card){
      const p=card.querySelector('h3')?.parentElement?.querySelector('p'); if(p) p.textContent='Write one or many instructions in normal language. ROTASTIC will interpret names, days, shifts, rooms, leave and rota rules, then show one clear confirmation before applying.';
      const ta=document.getElementById('scheduleAmendmentInput'); if(ta) ta.placeholder='Examples: Dr Husam to Room 12 Tuesday; Dr Saima and Dr Maya on leave Wednesday; add Dr Moursi to Thursday PM';
    }
  }

  function initCleanup(){
    removeRedundantAdminBoxes(); consolidateCoreRules(); ensureGenerationRangeControl(); tuneAmendmentCopy(); makeDeveloperCreditSmaller(); rotasticEnhanceRotaNavigation(); rotasticShowSecurePhysicianEmails(); checkOneHourShiftReminder();
  }
  document.addEventListener('DOMContentLoaded',function(){ setTimeout(initCleanup,0); setTimeout(initCleanup,700); setTimeout(initCleanup,1800); });
  setInterval(function(){ try{ checkOneHourShiftReminder(); }catch(e){} },60000);

  const style=document.createElement('style');
  style.textContent='.rotastic-quick-day-nav{position:sticky;top:0;z-index:35;display:grid;grid-template-columns:42px minmax(120px,1fr) 42px;align-items:center;gap:8px;margin:0 0 10px;padding:8px;border:1px solid rgba(45,212,191,.22);border-radius:14px;background:rgba(2,6,23,.94);backdrop-filter:blur(10px)}.rotastic-quick-day-nav button{height:38px;border-radius:10px;border:1px solid rgba(148,163,184,.2);background:#0f172a;color:#e2e8f0}.rotastic-current-day{text-align:center;min-width:0}.rotastic-current-day strong{display:block;font-size:16px;color:#f8fafc;line-height:1.1}.rotastic-current-day span{display:block;font-size:10px;color:#94a3b8;margin-top:3px}.rotastic-week-jump{grid-column:1/-1;width:100%;background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.2);border-radius:9px;padding:6px 8px;font-size:10px}.rotastic-readable-room{font-size:14px!important;font-weight:900!important;color:#f8fafc!important;letter-spacing:.01em}.rotastic-physician-email{font-size:9px!important;color:#67e8f9!important;font-weight:600!important;margin-top:2px;overflow-wrap:anywhere}';
  document.head.appendChild(style);
})();
'''
          ui.write_text(j, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          git diff --check
          grep -q 'ROTASTIC_GENERATE_CLEANUP_20261026' admin-comms-ui.js
          grep -q '2026-10-28' admin-comms-ui.js
          grep -q 'rotasticGenerationRange' admin-comms-ui.js
          grep -q 'rotasticAvailableDoctorCountForDay' index.html
          grep -q 'rotastic-v237-generate-cleanup' service-worker.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-comms-ui.js service-worker.js
          git commit -m 'Consolidate Generate tools and improve rota controls'
          git push origin HEAD:main
