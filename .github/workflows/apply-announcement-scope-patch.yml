name: Apply announcement scope patch
on:
  push:
    paths:
      - '.github/workflows/apply-announcement-scope-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused announcement patch
        run: python .github/scripts/apply_announcement_scope_patch.py
      - name: Verify only index changed for site patch
        run: |
          git diff --check
          git diff -- index.html | head -n 260
      - name: Commit index only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Broaden announcements and align ticker'
          git push