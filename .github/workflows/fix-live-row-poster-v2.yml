name: Fix live row and poster v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Restore LIVE ETA temperature row') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only live row visibility and poster height
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<!-- rotastic-live-inline-tools-patch: only ETA/Weather/Refresh placement -->.*?<script id="rotastic-live-inline-tools-patch">.*?</script>\n?', '\n', s, flags=re.S)
          marker='rotastic-live-row-poster-v2'
          if marker not in s:
              css='''\n<style id="rotastic-live-row-poster-v2">\n.live-rota-meta-row {\n  display: grid !important;\n  grid-template-columns: minmax(74px,auto) minmax(92px,1fr) minmax(74px,auto) !important;\n  align-items: center !important;\n  gap: 6px !important;\n  visibility: visible !important;\n  opacity: 1 !important;\n}\n.live-rota-meta-row > * { visibility: visible !important; opacity: 1 !important; }\n.live-drive-slot { display:flex !important; justify-content:center !important; align-items:center !important; min-width:0 !important; }\n#driveTimeBtn, #weatherBadge { display:inline-flex !important; visibility:visible !important; opacity:1 !important; pointer-events:auto !important; }\n#driveTimeBtn { width:auto !important; min-width:88px !important; max-width:112px !important; }\n#weatherBadge { width:auto !important; min-width:68px !important; justify-content:center !important; }\n.personal-poster-card, .personal-poster-content { min-height:430px !important; }\n@media (max-width:520px) {\n  .live-rota-meta-row { grid-template-columns:minmax(72px,auto) minmax(88px,1fr) minmax(68px,auto) !important; gap:5px !important; }\n  .personal-poster-card, .personal-poster-content { min-height:438px !important; }\n}\n</style>\n'''
              head_end=s.find('</head>')
              if head_end<0: raise SystemExit('No real </head> found; refusing to modify')
              s=s[:head_end]+css+s[head_end:]
          required=['live-rota-meta-row','driveTimeBtn','weatherBadge','personal-poster-card','topActionGrid','scheduleMatrixContainer']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing required original UI anchors: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit exact UI correction
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore LIVE ETA temperature row and extend poster"
          git pull --rebase origin main
          git push origin HEAD:main
