name: Inspect exact rota layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout-short.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text().splitlines()
          a,b=6380,6545
          Path('layout-block.txt').write_text('\n'.join(f'{i+1}: {lines[i]}' for i in range(a-1,min(b,len(lines)))))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add layout-block.txt
          git commit -m 'Add temporary exact rota layout block' || exit 0
          git push
