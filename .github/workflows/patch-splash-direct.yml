name: Remove second web splash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-splash-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove HTML splash while preserving startup handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the native Android/PWA launch screen, but suppress the second
          # in-page HTML splash from the very first browser paint.
          style = """\n<style id=\"rotastic-second-splash-removal\">\n#rotasticOpeningSplash { display: none !important; visibility: hidden !important; pointer-events: none !important; }\n</style>\n"""
          if 'id="rotastic-second-splash-removal"' not in s:
              if '</head>' not in s:
                  raise SystemExit('head closing tag not found')
              s = s.replace('</head>', style + '</head>', 1)

          # Preserve the existing handoff work (schedule/ticker) but do it
          # immediately because the second HTML splash is no longer shown.
          if 'setTimeout(finishSplash, 4200);' in s:
              s = s.replace('setTimeout(finishSplash, 4200);', 'setTimeout(finishSplash, 0);', 1)
          elif 'setTimeout(finishSplash, 0);' not in s:
              raise SystemExit('normal splash timer anchor not found')

          if 'setTimeout(finishSplash, 5000);' in s:
              s = s.replace('setTimeout(finishSplash, 5000);', 'setTimeout(finishSplash, 100);', 1)
          elif 'setTimeout(finishSplash, 100);' not in s:
              raise SystemExit('safety splash timer anchor not found')

          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          old_cache = "const CACHE = 'rotastic-v229-single-splash';"
          new_cache = "const CACHE = 'rotastic-v230-no-html-splash';"
          if old_cache in w:
              w = w.replace(old_cache, new_cache, 1)
          elif new_cache not in w:
              raise SystemExit('service worker cache anchor not found')
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit second splash removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --check
          git commit -m "Remove second web splash layer"
          git push origin HEAD:main
