name: Patch splash directly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-splash-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make opening splash one-way
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_old = "function startOpeningSplash() {\n  try { updateOpeningSplashName(); }"
          start_new = "function startOpeningSplash() {\n  if (window.__rotasticSplashDismissed || window.__rotasticSplashStarted) return;\n  window.__rotasticSplashStarted = true;\n\n  try { updateOpeningSplashName(); }"
          if start_old not in s:
              raise SystemExit('startOpeningSplash anchor not found')
          s = s.replace(start_old, start_new, 1)

          escape_old = "    var splash = document.getElementById('rotasticOpeningSplash');\n    if (!splash) return;\n\n    splash.classList.add('rotastic-splash-hide');"
          escape_new = "    var splash = document.getElementById('rotasticOpeningSplash');\n    if (!splash) return;\n\n    window.__rotasticSplashDismissed = true;\n    window.__rotasticSplashStarted = false;\n    splash.classList.add('rotastic-splash-hide');"
          if escape_old not in s:
              raise SystemExit('forceEscapeSplash anchor not found')
          s = s.replace(escape_old, escape_new, 1)

          finish_old = "    if (finished) return;\n    finished = true;\n\n    if (window.__rotasticSplashEscapeTimer) {"
          finish_new = "    if (finished) return;\n    finished = true;\n    window.__rotasticSplashDismissed = true;\n    window.__rotasticSplashStarted = false;\n\n    if (window.__rotasticSplashEscapeTimer) {"
          if finish_old not in s:
              raise SystemExit('finishSplash anchor not found')
          s = s.replace(finish_old, finish_new, 1)

          # Once hidden, remove the overlay from the DOM so no later startup path can resurrect it.
          emergency_old = "    setTimeout(function () {\n      splash.style.display = 'none';\n    }, 260);"
          emergency_new = "    setTimeout(function () {\n      splash.style.display = 'none';\n      if (splash.parentNode) splash.parentNode.removeChild(splash);\n    }, 260);"
          if emergency_old not in s:
              raise SystemExit('emergency hide anchor not found')
          s = s.replace(emergency_old, emergency_new, 1)

          finish_hide_old = "    setTimeout(function() {\n      splash.style.display = 'none';\n      splash.style.pointerEvents = 'none';\n    }, 420);"
          finish_hide_new = "    setTimeout(function() {\n      splash.style.display = 'none';\n      splash.style.pointerEvents = 'none';\n      if (splash.parentNode) splash.parentNode.removeChild(splash);\n    }, 420);"
          if finish_hide_old not in s:
              raise SystemExit('normal hide anchor not found')
          s = s.replace(finish_hide_old, finish_hide_new, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          old_cache = "const CACHE = 'rotastic-v227-known-working-dark';"
          new_cache = "const CACHE = 'rotastic-v228-direct-splash-fix';"
          if old_cache not in w:
              raise SystemExit('service worker cache anchor not found')
          sw.write_text(w.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY
      - name: Commit direct splash fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --check
          git commit -m "Fix opening splash one-way dismissal"
          git push origin HEAD:main
