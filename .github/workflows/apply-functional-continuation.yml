name: Apply ROTASTIC functional continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-functional-continuation.yml'
      - 'scripts/apply-functional-continuation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply functional patch
        run: python3 scripts/apply-functional-continuation.py
      - name: Verify and commit
        run: |
          git diff --check
          grep -q "rotasticGenerationRange" index.html
          grep -q "2026-10-28" index.html
          grep -q "renderPersonalMetrics" index.html
          grep -q "rotastic_redeem_admin_access_code" index.html
          grep -q 'id="tickerContent"' index.html
          grep -q 'You are off today' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git rm -f .github/workflows/apply-functional-continuation.yml .github/workflows/inspect-functional.yml functional-inspection.txt scripts/apply-functional-continuation.py || true
          git add -A
          git commit -m 'Complete core ROTASTIC functional wiring without redesign'
          git push
