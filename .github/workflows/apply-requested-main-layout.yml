name: Apply requested main rota reordering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-requested-main-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch restored design in place
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text()
          original=text

          # 1) LIVE / ETA / Weather share the existing compact metadata row.
          top_export=re.compile(r'<button class="rotastic-top-export-card" id="topExportCard".*?</button>\s*',re.S)
          text,n=top_export.subn('',text,count=1)
          if n!=1: raise SystemExit(f'Expected one top export card, found {n}')

          old_live='''<div class="rotastic-live-mini" id="rotasticLiveMini">\n<span class="relative flex h-1.5 w-1.5 flex-shrink-0">\n  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>\n  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>\n</span>\n<span class="rotastic-live-mini-label">LIVE</span>\n<button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>\n</div>'''
          if old_live not in text: raise SystemExit('Standalone LIVE row not found')
          text=text.replace(old_live,'',1)
          compact_live='''<div class="rotastic-live-mini rotastic-live-inline" id="rotasticLiveMini">\n<span class="relative flex h-1.5 w-1.5 flex-shrink-0">\n  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-60"></span>\n  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-500"></span>\n</span>\n<span class="rotastic-live-mini-label">LIVE</span>\n<button id="liveRotaUpdatedAt" onclick="toggleLiveRotaUpdatedDetail()" title="Tap to show full update time" type="button">Updated (--:--)</button>\n</div>\n'''
          marker='<div class="live-drive-slot">'
          if marker not in text: raise SystemExit('ETA slot not found')
          text=text.replace(marker,compact_live+marker,1)

          # 2) Keep the requested three action boxes only; remove the redundant hidden Export toggle.
          dup_export=re.compile(r'<button class="hidden px-3 py-1\.5 rounded-lg bg-slate-900/70 hover:bg-slate-800 text-slate-300 border border-slate-800 text-\[11px\] font-bold transition items-center gap-1\.5" id="rotaExportToggleBtn" onclick="toggleRotaExportMenu\(\)" type="button">.*?</button>\s*',re.S)
          text,n=dup_export.subn('',text,count=1)
          if n!=1: raise SystemExit(f'Expected one duplicate export toggle, found {n}')

          # 3) Replace the redundant weekday strip with one compact day/date/room navigator.
          old_days='''<div class="flex items-center justify-between space-x-1.5 overflow-x-auto no-scrollbar py-1" id="rotaDaySelector">\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-teal-500/15 text-teal-300 border border-teal-500/30" onclick="filterDay(0)" type="button">Sun</button>\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white border border-transparent" onclick="filterDay(1)" type="button">Mon</button>\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white border border-transparent" onclick="filterDay(2)" type="button">Tue</button>\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white border border-transparent" onclick="filterDay(3)" type="button">Wed</button>\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white border border-transparent" onclick="filterDay(4)" type="button">Thu</button>\n<button class="day-pill px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white border border-transparent" onclick="filterDay(-1)" type="button">All Week</button>\n</div>'''
          new_days='''<div class="flex items-center justify-between gap-2 py-1" id="rotaDaySelector">\n<button aria-label="Previous rota day" class="rotastic-day-nav-arrow" onclick="rotasticMoveRotaDay(-1)" type="button"><i class="fa-solid fa-chevron-left"></i></button>\n<div class="rotastic-day-nav-copy">\n<div class="rotastic-day-nav-name" id="rotasticDayNavName">Sunday</div>\n<div class="rotastic-day-nav-meta" id="rotasticDayNavMeta">Date · Room —</div>\n</div>\n<button aria-label="Next rota day" class="rotastic-day-nav-arrow" onclick="rotasticMoveRotaDay(1)" type="button"><i class="fa-solid fa-chevron-right"></i></button>\n</div>'''
          if old_days not in text: raise SystemExit('Original weekday strip not found')
          text=text.replace(old_days,new_days,1)

          # 4) Tiny source-level styling only for the requested compact arrangement.
          css='''\n<style id="rotastic-requested-compact-rota">\n/* Requested minor reordering only: preserve the restored visual design. */\n.live-rota-meta-row{grid-template-columns:auto minmax(92px,1fr) auto!important;gap:6px!important;align-items:center!important}\n.rotastic-live-inline{display:flex!important;align-items:center!important;gap:5px!important;margin:0!important;min-width:0!important;white-space:nowrap!important}\n.rotastic-live-inline #liveRotaUpdatedAt{max-width:72px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}\n#topActionGrid{margin-top:2px!important}\n#rotaSecondaryTools{min-height:0!important;height:0!important;margin:0!important;padding:0!important;overflow:visible!important}\n#rotaSecondaryTools>div{height:0!important;min-height:0!important;overflow:visible!important}\n#rotaDaySelector{margin:3px 0 7px!important;padding:4px 2px!important;overflow:visible!important}\n.rotastic-day-nav-arrow{width:36px!important;height:36px!important;flex:0 0 36px!important;border-radius:10px!important;border:1px solid rgba(51,65,85,.95)!important;background:rgba(15,23,42,.78)!important;color:#cbd5e1!important;display:grid!important;place-items:center!important}\n.rotastic-day-nav-copy{min-width:0!important;flex:1!important;text-align:center!important;line-height:1.1!important}\n.rotastic-day-nav-name{font-size:15px!important;font-weight:900!important;color:#f8fafc!important}\n.rotastic-day-nav-meta{margin-top:3px!important;font-size:10px!important;font-weight:750!important;color:#7dd3fc!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}\n@media(max-width:520px){.live-rota-meta-row{grid-template-columns:minmax(72px,auto) minmax(92px,1fr) minmax(62px,auto)!important;gap:5px!important}.rotastic-live-inline #liveRotaUpdatedAt{display:none!important}.live-drive-slot #driveTimeBtn{height:24px!important;padding:0 6px!important}.live-drive-slot #driveTimeBtnText{font-size:9px!important}.live-drive-slot #driveTimeBtnSub{display:none!important}#weatherBadge{height:24px!important;font-size:9px!important}}\n</style>\n'''
          if 'id="rotastic-requested-compact-rota"' not in text:
              text=text.replace('</head>',css+'</head>',1)

          # 5) Navigation behavior reads the already-rendered rota; no cards or content are moved.
          js='''\n<script id="rotastic-requested-day-navigation">\n(function(){\n  function qatarDateLabel(iso){\n    if(!iso)return '';\n    try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Qatar',day:'numeric',month:'short',year:'numeric'}).format(new Date(iso+'T12:00:00+03:00'));}catch(_){return iso;}\n  }\n  function selectedIndex(){\n    if(typeof activeDayIndex==='number' && activeDayIndex>=0)return activeDayIndex;\n    return 0;\n  }\n  function roomFromRenderedRota(){\n    var name=(typeof activeUserDocName!=='undefined'&&activeUserDocName)?String(activeUserDocName).trim():'';\n    var root=document.getElementById('scheduleMatrixContainer');\n    if(name&&root){\n      var nodes=[].slice.call(root.querySelectorAll('.rotastic-room-grid > *, .room-card, [class*="room"]'));\n      for(var i=0;i<nodes.length;i++){\n        var t=String(nodes[i].textContent||'').replace(/\\s+/g,' ').trim();\n        if(t.indexOf(name)===-1)continue;\n        var m=t.match(/\\bRoom\\s*(\\d+[A-Za-z]?)\\b/i);\n        if(m)return m[1];\n      }\n    }\n    var hero=document.getElementById('mainRoomHeroNumber');\n    var h=hero?String(hero.textContent||'').trim():'';\n    return h&&h!=='—'?h:'';\n  }\n  window.rotasticUpdateDayNavigator=function(){\n    var days=(typeof currentSchedule!=='undefined'&&Array.isArray(currentSchedule))?currentSchedule:[];\n    if(!days.length)return;\n    var i=Math.max(0,Math.min(selectedIndex(),days.length-1));\n    var d=days[i]||{};\n    var n=document.getElementById('rotasticDayNavName');\n    var m=document.getElementById('rotasticDayNavMeta');\n    if(n)n.textContent=String(d.day||d.dayName||['Sunday','Monday','Tuesday','Wednesday','Thursday'][i]||'Day');\n    var room=roomFromRenderedRota();\n    var date=qatarDateLabel(d.isoDate||'');\n    if(m)m.textContent=(date||String(d.dateLabel||''))+(room?' · Room '+room:' · Room —');\n  };\n  window.rotasticMoveRotaDay=function(delta){\n    var days=(typeof currentSchedule!=='undefined'&&Array.isArray(currentSchedule))?currentSchedule:[];\n    if(!days.length||typeof filterDay!=='function')return;\n    var count=Math.min(days.length,5);\n    var i=selectedIndex();\n    i=(i+delta+count)%count;\n    filterDay(i);\n    setTimeout(window.rotasticUpdateDayNavigator,40);\n    setTimeout(window.rotasticUpdateDayNavigator,180);\n  };\n  function bind(){setTimeout(window.rotasticUpdateDayNavigator,50);setTimeout(window.rotasticUpdateDayNavigator,400);}\n  document.addEventListener('DOMContentLoaded',bind);\n  document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('[data-rotastic-rota-toggle="1"]'))setTimeout(window.rotasticUpdateDayNavigator,120);},true);\n  var root=document.getElementById('scheduleMatrixContainer');\n  if(root&&window.MutationObserver)new MutationObserver(function(){setTimeout(window.rotasticUpdateDayNavigator,20);}).observe(root,{childList:true,subtree:true});\n})();\n</script>\n'''
          if 'id="rotastic-requested-day-navigation"' not in text:
              text=text.replace('</body>',js+'</body>',1)

          # Safety checks: preserve the design anchors and all requested actions.
          checks={
            'announcement ticker':'id="tickerContent"',
            'personal poster':'You are off today',
            'rota view':'<span>Rota View</span>',
            'request swap':'<span>Request Swap</span>',
            'export':'id="topExportBtn"',
            'export submenu':'id="rotaExportActions"',
            'ETA':'id="driveTimeBtn"',
            'weather':'id="weatherBadge"',
            'LIVE':'id="rotasticLiveMini"',
            'rota body':'id="scheduleMatrixContainer"',
          }
          missing=[k for k,v in checks.items() if v not in text]
          if missing: raise SystemExit('Missing preserved design anchors: '+', '.join(missing))
          if text.count('id="rotasticLiveMini"')!=1: raise SystemExit('LIVE indicator duplicated')
          if 'class="day-pill' in text[text.find('id="topActionGrid"'):text.find('<!-- LEAVES:')]: raise SystemExit('Redundant weekday pills remain in main rota block')
          if text.count('id="topActionGrid"')!=1: raise SystemExit('Action grid duplicated')
          if text==original: raise SystemExit('No changes made')
          p.write_text(text)
          PY

          # Diff guard: only index.html plus temporary inspection cleanup should change.
          git diff --check
          grep -q 'id="topExportBtn"' index.html
          grep -q 'id="rotasticDayNavName"' index.html
          grep -q 'id="rotasticLiveMini"' index.html
          grep -q 'You are off today' index.html
          grep -q 'id="tickerContent"' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/apply-requested-main-layout.yml .github/workflows/inspect-layout.yml .github/workflows/inspect-layout-short.yml layout-inspection.txt layout-block.txt || true
          git add -A
          git commit -m 'Reorder main rota controls without changing restored design'
          git push
