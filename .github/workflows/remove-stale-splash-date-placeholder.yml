name: Remove stale splash date placeholder
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-stale-splash-date-placeholder.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only stale static splash date
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="rotastic-splash-date" id="rotasticSplashDate">Today is Monday, 1 January 2026</div>'
          new='<div class="rotastic-splash-date" id="rotasticSplashDate">Today</div>'
          if s.count(old)!=1:
              raise SystemExit('Expected stale splash placeholder exactly once')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove stale January 1 splash placeholder"
          git pull --rebase origin main
          git push origin HEAD:main
