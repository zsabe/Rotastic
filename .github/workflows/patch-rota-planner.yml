name: Apply Rota Planner matrix patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'
      - 'scripts/patch_rota_planner_v5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner
        run: python3 scripts/patch_rota_planner_v5.py
      - name: Commit planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Render Rota Planner from actual rota schedule"
          git push origin HEAD:main
