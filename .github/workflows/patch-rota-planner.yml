name: Surgical Rota Planner update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Rota Planner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'rotastic-planner-modern-v1' in s:
              raise SystemExit(0)
          patch=r'''
          <style id="rotastic-planner-modern-v1">
          #rotaPlanner .rotastic-planner-toolbar,#rotaPlannerView .rotastic-planner-toolbar,[data-rota-planner] .rotastic-planner-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
          #rotaPlanner .rotastic-planner-group,#rotaPlannerView .rotastic-planner-group,[data-rota-planner] .rotastic-planner-group{min-width:132px}
          #rotaPlanner table,#rotaPlannerView table,[data-rota-planner] table{border-collapse:separate;border-spacing:0;min-width:max-content}
          #rotaPlanner .planner-scroll,#rotaPlannerView .planner-scroll,[data-rota-planner] .planner-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
          #rotaPlanner table th:first-child,#rotaPlanner table td:first-child,#rotaPlannerView table th:first-child,#rotaPlannerView table td:first-child,[data-rota-planner] table th:first-child,[data-rota-planner] table td:first-child{position:sticky;left:0;z-index:3;min-width:150px;max-width:190px;backdrop-filter:blur(14px)}
          #rotaPlanner table thead th,#rotaPlannerView table thead th,[data-rota-planner] table thead th{position:sticky;top:0;z-index:2;white-space:nowrap}
          #rotaPlanner table thead th:first-child,#rotaPlannerView table thead th:first-child,[data-rota-planner] table thead th:first-child{z-index:4}
          #rotaPlanner table td:not(:first-child),#rotaPlanner table th:not(:first-child),#rotaPlannerView table td:not(:first-child),#rotaPlannerView table th:not(:first-child),[data-rota-planner] table td:not(:first-child),[data-rota-planner] table th:not(:first-child){min-width:74px;text-align:center}
          #rotaPlanner table tbody td,#rotaPlannerView table tbody td,[data-rota-planner] table tbody td{height:54px}
          #rotaPlanner table tbody td:not(:first-child)>*,#rotaPlannerView table tbody td:not(:first-child)>*,[data-rota-planner] table tbody td:not(:first-child)>*{border-radius:10px}
          </style>
          <script id="rotastic-planner-modern-v1-js">
          (function(){
            function txt(n){return String(n&&n.textContent||'').replace(/\s+/g,' ').trim();}
            function plannerRoot(){
              var direct=document.querySelector('#rotaPlanner,#rotaPlannerView,[data-rota-planner]');
              if(direct)return direct;
              var h=Array.from(document.querySelectorAll('h1,h2,h3,h4')).find(function(x){return /Rota Planner/i.test(txt(x));});
              return h&&(h.closest('.clean-card,.tab-content,.tab-pane,.view,.section')||h.parentElement);
            }
            function inferGroup(name){
              try{
                if(typeof getDoctorGroup==='function')return String(getDoctorGroup(name)||'').replace(/[^12]/g,'');
                if(typeof getPhysicianGroup==='function')return String(getPhysicianGroup(name)||'').replace(/[^12]/g,'');
              }catch(e){}
              return '';
            }
            function enhance(){
              var root=plannerRoot(); if(!root)return;
              var table=root.querySelector('table');
              if(table&&!table.parentElement.classList.contains('planner-scroll')){
                var wrap=document.createElement('div');wrap.className='planner-scroll';table.parentNode.insertBefore(wrap,table);wrap.appendChild(table);
              }
              if(!root.querySelector('.rotastic-planner-toolbar')){
                var toolbar=document.createElement('div');toolbar.className='rotastic-planner-toolbar';
                var label=document.createElement('label');label.textContent='Display group ';
                var sel=document.createElement('select');sel.className='rotastic-planner-group';sel.setAttribute('aria-label','Rota Planner group');
                sel.innerHTML='<option value="1">Group 1</option><option value="2">Group 2</option>';label.appendChild(sel);toolbar.appendChild(label);
                var heading=Array.from(root.querySelectorAll('h1,h2,h3,h4')).find(function(x){return /Rota Planner/i.test(txt(x));});
                if(heading)heading.insertAdjacentElement('afterend',toolbar);else root.insertBefore(toolbar,root.firstChild);
                sel.addEventListener('change',function(){filter(root,sel.value);});filter(root,sel.value);
              }
            }
            function filter(root,wanted){
              var t=root.querySelector('table');if(!t)return;
              Array.from(t.querySelectorAll('tbody tr')).forEach(function(row){var g=inferGroup(txt(row.cells&&row.cells[0]));if(g)row.style.display=(g===wanted?'':'none');});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhance);else enhance();
            document.addEventListener('click',function(e){if(e.target&&/Rota Planner/i.test(txt(e.target)))setTimeout(enhance,80);},true);
            new MutationObserver(function(){setTimeout(enhance,20);}).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('body anchor missing')
          s=s[:pos]+patch+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Modernise Rota Planner only"
          git push origin HEAD:main
