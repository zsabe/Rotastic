name: Apply Rota Planner matrix patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'
      - 'scripts/patch_rota_final_invariants.py'
      - 'scripts/patch_gani_group2.py'
      - 'scripts/patch_export_completeness.py'
      - 'scripts/patch_smart_box_week_commands.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce final rota invariants without UI changes
        run: python3 scripts/patch_rota_final_invariants.py
      - name: Enforce Dr Gani as Group 2
        run: python3 scripts/patch_gani_group2.py
      - name: Keep every generated physician visible in export
        run: python3 scripts/patch_export_completeness.py
      - name: Add Smart Box weekly natural-language commands
        run: python3 scripts/patch_smart_box_week_commands.py
      - name: Commit rendered generator logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rotastic-export-template.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Integrate final rota invariants, export and Smart Box commands"
          git push origin HEAD:main
