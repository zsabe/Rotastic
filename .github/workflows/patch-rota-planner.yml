name: Remove Rota Planner week commencing control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide Week Commencing control in Rota Planner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='rotastic-hide-week-commencing-v1'
          if marker in s:
              raise SystemExit(0)
          patch=r'''
          <style id="rotastic-hide-week-commencing-v1">
          .rotastic-week-commencing-hidden{display:none!important}
          </style>
          <script id="rotastic-hide-week-commencing-v1-js">
          (function(){
            function text(e){return String(e&&e.textContent||'').replace(/\s+/g,' ').trim()}
            function hide(){
              var cal=document.getElementById('weeklyLeaveCalendar');
              if(!cal)return;
              var root=cal.closest('.clean-card')||cal.parentElement;
              if(!root)return;
              Array.from(root.querySelectorAll('label,div,span,p')).forEach(function(e){
                if(!/^Week\s+Commencing\b/i.test(text(e)))return;
                var box=e.closest('label')||e;
                if(box.querySelector('select')||box.nextElementSibling&&box.nextElementSibling.tagName==='SELECT')box.classList.add('rotastic-week-commencing-hidden');
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(hide,100)});else setTimeout(hide,100);
            new MutationObserver(function(){setTimeout(hide,50)}).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('body anchor missing')
          s=s[:pos]+patch+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit surgical change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Remove Rota Planner Week Commencing dropdown"
          git push origin HEAD:main
