name: Surgical Rota Planner update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual Rota Planner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'rotastic-planner-modern-v2' in s: raise SystemExit(0)
          patch=r'''
<style id="rotastic-planner-modern-v2">
/* Surgical styling for the existing weeklyLeaveCalendar only */
#weeklyLeaveCalendar{display:flex!important;gap:12px!important;overflow-x:auto!important;overflow-y:hidden!important;padding:4px 2px 14px!important;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#weeklyLeaveCalendar>.planner-week-day-card{flex:0 0 min(82vw,360px)!important;scroll-snap-align:start;border-radius:16px!important}
#weeklyLeaveCalendar .planner-day-header{position:sticky;top:0;z-index:2}
#weeklyLeaveCalendar [class*="physician"],#weeklyLeaveCalendar [class*="doctor"]{border-radius:10px}
#weeklyLeaveCalendar.rotastic-group-filtered .rotastic-group-hidden{display:none!important}
.rotastic-planner-v2-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rotastic-planner-v2-toolbar label{font-size:12px;font-weight:800;letter-spacing:.02em}
.rotastic-planner-v2-toolbar select{min-width:130px}
@media(min-width:900px){#weeklyLeaveCalendar>.planner-week-day-card{flex-basis:330px!important}}
</style>
<script id="rotastic-planner-modern-v2-js">
(function(){
 function text(n){return String(n&&n.textContent||'').replace(/\s+/g,' ').trim();}
 function groupOf(el){
   var t=text(el);
   if(/\bGroup\s*1\b/i.test(t))return '1';
   if(/\bGroup\s*2\b/i.test(t))return '2';
   return '';
 }
 function applyGroup(cal,wanted){
   cal.classList.add('rotastic-group-filtered');
   Array.from(cal.querySelectorAll('*')).forEach(function(el){
     if(el.children.length>12)return;
     var g=groupOf(el);
     if(!g)return;
     var block=el.closest('[class*="group"],[class*="section"],[class*="panel"],[class*="card"]')||el;
     if(block===cal||block.classList.contains('planner-week-day-card'))return;
     block.classList.toggle('rotastic-group-hidden',g!==wanted);
   });
 }
 function enhance(){
   var cal=document.getElementById('weeklyLeaveCalendar');if(!cal)return;
   var host=cal.parentElement;if(!host)return;
   if(!host.querySelector('.rotastic-planner-v2-toolbar')){
     var bar=document.createElement('div');bar.className='rotastic-planner-v2-toolbar';
     var label=document.createElement('label');label.textContent='Display group ';
     var sel=document.createElement('select');sel.setAttribute('aria-label','Display planner group');
     sel.innerHTML='<option value="1">Group 1</option><option value="2">Group 2</option>';
     label.appendChild(sel);bar.appendChild(label);host.insertBefore(bar,cal);
     sel.addEventListener('change',function(){applyGroup(cal,sel.value)});
     applyGroup(cal,sel.value);
   }
   var exportSel=document.getElementById('plannerExportScope');
   if(exportSel){
     Array.from(exportSel.options).forEach(function(o){if(/group\s*1/i.test(o.text))o.text='Group 1';if(/group\s*2/i.test(o.text))o.text='Group 2';});
   }
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(enhance,50)});else setTimeout(enhance,50);
 new MutationObserver(function(){setTimeout(enhance,30)}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
'''
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('body anchor missing')
          p.write_text(s[:pos]+patch+s[pos:],encoding='utf-8')
          PY
      - name: Commit planner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Fix Rota Planner visible timeline"
          git push origin HEAD:main
