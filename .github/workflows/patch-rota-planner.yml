name: Render Rota Planner from actual rota schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rota-planner.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schedule matrix planner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove only our previous planner injections; leave original ROTASTIC source untouched.
          for stem in ['rotastic-planner-modern-v2','rotastic-planner-matrix-v3','rotastic-hide-week-commencing-v1','rotastic-planner-fix-export-v4','rotastic-rota-matrix-v5']:
              s=re.sub(r'\s*<style id="'+re.escape(stem)+r'">.*?</style>\s*<script id="'+re.escape(stem)+r'-js">.*?</script>\s*','\n',s,flags=re.S)
          marker='rotastic-rota-matrix-v5'
          patch=r'''
<style id="rotastic-rota-matrix-v5">
.rotastic-rota-matrix-shell{margin:0 0 16px}.rrm-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.rrm-toolbar-left,.rrm-toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rrm-toolbar label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8}.rrm-toolbar select,.rrm-btn{background:#0b1220;color:#e2e8f0;border:1px solid rgba(100,116,139,.5);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.rrm-btn{cursor:pointer}.rrm-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(148,163,184,.13);border-radius:16px;background:rgba(2,6,23,.22)}.rrm-table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:11px}.rrm-table th,.rrm-table td{min-width:94px;height:48px;padding:5px 7px;text-align:center;border-right:1px solid rgba(148,163,184,.10);border-bottom:1px solid rgba(148,163,184,.10);white-space:nowrap}.rrm-table thead th{position:sticky;top:0;z-index:4;background:#111a2b;color:#e2e8f0}.rrm-table .rrm-name{position:sticky;left:0;z-index:3;min-width:158px;max-width:190px;text-align:left;background:#101827;font-weight:900;box-shadow:8px 0 16px rgba(0,0,0,.16)}.rrm-table thead .rrm-name{z-index:6}.rrm-table tbody tr:nth-child(even) td:not(.rrm-name){background:rgba(255,255,255,.018)}.rrm-day{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8}.rrm-date{display:block;font-size:14px;font-weight:900;margin-top:2px}.rrm-pill{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;padding:5px 7px;border-radius:9px;background:rgba(20,184,166,.11);border:1px solid rgba(45,212,191,.18);color:#ccfbf1;font-weight:800}.rrm-empty{opacity:.25}.rrm-today{box-shadow:inset 0 2px 0 #2dd4bf,inset 0 -2px 0 rgba(45,212,191,.45)}.rrm-weekend{background:rgba(148,163,184,.035)}.rrm-note{font-size:10px;color:#64748b}.rrm-no-rota{padding:18px;color:#94a3b8;text-align:center}.rotastic-hide-week-select{display:none!important}
@media(max-width:700px){.rrm-table th,.rrm-table td{min-width:82px;height:45px}.rrm-table .rrm-name{min-width:132px;max-width:150px}.rrm-toolbar{align-items:flex-start}}
</style>
<script id="rotastic-rota-matrix-v5-js">
(function(){
 var busy=false, chosen='1';
 function same(a,b){try{return typeof doctorMatches==='function'?doctorMatches(a,b):String(a||'').toLowerCase()===String(b||'').toLowerCase()}catch(e){return String(a||'').toLowerCase()===String(b||'').toLowerCase()}}
 function rules(){try{return typeof getAutoRotaRules==='function'?getAutoRotaRules():null}catch(e){return null}}
 function days(){return Array.isArray(window.currentSchedule)?window.currentSchedule:[]}
 function labelKey(path){var p=path.join('.');var per=/^am\b/i.test(p)?'AM':(/^pm\b/i.test(p)?'PM':'');var room=p.match(/rooms\.(\d+)/i);if(room)return (per?per+' ':'')+'R'+room[1];if(/cbAM/i.test(p))return 'AM CB';if(/cbPM/i.test(p))return 'PM CB';if(/twilight/i.test(p))return 'Twilight';var last=String(path[path.length-1]||'').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[_-]/g,' ');return ((per?per+' ':'')+last).trim().toUpperCase()}
 function assignments(day,doctor){var out=[];if(!day)return out;try{if(Array.isArray(day.leaves)&&day.leaves.some(function(x){return same(typeof x==='string'?x:(x&&x.name),doctor)}))out.push('AL')}catch(e){}
   function walk(v,path){if(v==null)return;if(typeof v==='string'){if(same(v,doctor))out.push(labelKey(path));return}if(Array.isArray(v)){v.forEach(function(x,i){walk(x,path.concat(String(i))) });return}if(typeof v==='object'){Object.keys(v).forEach(function(k){if(k==='leaves')return;walk(v[k],path.concat(k))})}}
   ['am','pm','cbAM','cbPM','twilight','twilightDoctors'].forEach(function(k){if(day[k]!=null)walk(day[k],[k])});return Array.from(new Set(out.filter(Boolean))) }
 function dateObj(day,i){var raw=day&&(day.isoDate||day.date);if(raw){var d=new Date(String(raw).slice(0,10)+'T12:00:00');if(!isNaN(d))return d}var d2=new Date();d2.setDate(d2.getDate()+i);return d2}
 function hideWeek(){var s=document.getElementById('plannerWeekSelect');if(s){var box=s.parentElement;if(box)box.classList.add('rotastic-hide-week-select')}}
 function root(){var cal=document.getElementById('weeklyLeaveCalendar');return cal&&(cal.closest('.clean-card')||cal.parentElement)}
 function build(){if(busy)return;busy=true;try{hideWeek();var r=root();if(!r)return;var old=r.querySelector('.rotastic-rota-matrix-shell');if(old)old.remove();var ds=days();var rr=rules();var members=rr?(chosen==='1'?rr.group1:rr.group2):[];var shell=document.createElement('div');shell.className='rotastic-rota-matrix-shell';var bar=document.createElement('div');bar.className='rrm-toolbar';bar.innerHTML='<div class="rrm-toolbar-left"><label>Display group</label><select aria-label="Rota Planner group"><option value="1">Group 1</option><option value="2">Group 2</option></select><span class="rrm-note">Scroll right for more dates</span></div><div class="rrm-toolbar-right"><button class="rrm-btn" type="button" data-x="png">PNG</button><button class="rrm-btn" type="button" data-x="pdf">PDF</button></div>';shell.appendChild(bar);var sel=bar.querySelector('select');sel.value=chosen;sel.onchange=function(){chosen=this.value;build()};var wrap=document.createElement('div');wrap.className='rrm-wrap';
   if(!ds.length||!members.length){wrap.innerHTML='<div class="rrm-no-rota">'+(!ds.length?'No released/generated rota is currently available.':'No physicians found for this group.')+'</div>'}else{var table=document.createElement('table');table.className='rrm-table';var h='<thead><tr><th class="rrm-name">Physician</th>';var today=new Date().toDateString();ds.forEach(function(day,i){var d=dateObj(day,i),c=(d.toDateString()===today?' rrm-today':'')+([5,6].indexOf(d.getDay())>=0?' rrm-weekend':'');h+='<th class="'+c+'"><span class="rrm-day">'+d.toLocaleDateString(undefined,{weekday:'short'})+'</span><span class="rrm-date">'+d.getDate()+'</span></th>'});h+='</tr></thead><tbody>';members.forEach(function(name){h+='<tr><td class="rrm-name">'+String(name).replace(/</g,'&lt;')+'</td>';ds.forEach(function(day,i){var a=assignments(day,name),d=dateObj(day,i),c=(d.toDateString()===today?' rrm-today':'')+([5,6].indexOf(d.getDay())>=0?' rrm-weekend':'');h+='<td class="'+c+(a.length?'':' rrm-empty')+'">'+(a.length?'<span class="rrm-pill" title="'+a.join(' · ')+'">'+a.join(' · ')+'</span>':'—')+'</td>'});h+='</tr>'});h+='</tbody>';table.innerHTML=h;wrap.appendChild(table)}shell.appendChild(wrap);var cal=document.getElementById('weeklyLeaveCalendar');if(cal&&cal.parentElement)cal.parentElement.insertBefore(shell,cal);else r.appendChild(shell);bar.querySelector('[data-x="png"]').onclick=function(){exportMatrix(shell,'png')};bar.querySelector('[data-x="pdf"]').onclick=function(){exportMatrix(shell,'pdf')}
 }finally{busy=false}}
 async function exportMatrix(shell,type){var target=shell.querySelector('.rrm-wrap');if(!target||typeof html2canvas!=='function')return;var group='Group '+chosen;var clone=document.createElement('div');clone.style.cssText='position:fixed;left:-20000px;top:0;width:1500px;padding:42px;background:#fff;color:#172033;font-family:Arial,sans-serif;z-index:-1';clone.innerHTML='<div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:24px"><div><div style="font-size:12px;font-weight:900;letter-spacing:.18em;color:#14b8a6">ROTASTIC</div><div style="font-size:30px;font-weight:900;margin-top:4px">Physician Rota Planner</div><div style="font-size:13px;color:#64748b;margin-top:5px">Abu Nakhla Health Centre · '+group+'</div></div><div style="font-size:12px;color:#64748b">'+new Date().toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})+'</div></div>';var c=target.cloneNode(true);c.style.overflow='visible';c.style.border='1px solid #e2e8f0';clone.appendChild(c);document.body.appendChild(clone);Array.from(clone.querySelectorAll('table,th,td')).forEach(function(e){e.style.color='#172033';e.style.background='#fff';e.style.borderColor='#e5e7eb'});Array.from(clone.querySelectorAll('.rrm-name')).forEach(function(e){e.style.position='static';e.style.background='#f8fafc'});Array.from(clone.querySelectorAll('.rrm-pill')).forEach(function(e){e.style.background='#e6fffb';e.style.color='#115e59';e.style.border='1px solid #99f6e4'});try{var canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true});if(type==='png'){var a=document.createElement('a');a.download='ROTASTIC-'+group.replace(' ','-')+'-Rota.png';a.href=canvas.toDataURL('image/png');a.click()}else if(window.jspdf&&window.jspdf.jsPDF){var jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),img=canvas.toDataURL('image/jpeg',.95),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),ratio=Math.min((pw-36)/canvas.width,(ph-36)/canvas.height);pdf.addImage(img,'JPEG',18,18,canvas.width*ratio,canvas.height*ratio);pdf.save('ROTASTIC-'+group.replace(' ','-')+'-Rota.pdf')}}finally{clone.remove()}}
 function go(){build();setTimeout(build,700);setTimeout(build,1800)}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
 document.addEventListener('click',function(e){var t=e.target&&e.target.closest&&e.target.closest('[data-tab],button');if(t)setTimeout(build,180)},true);
 window.addEventListener('rotastic-rota-released',function(){setTimeout(build,100)});
})();
</script>
'''
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('body anchor missing')
          s=s[:pos]+patch+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Render Rota Planner from actual rota schedule"
          git push origin HEAD:main
