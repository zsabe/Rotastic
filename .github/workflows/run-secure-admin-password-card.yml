name: Run secure admin password card patch

on:
  push:
    branches: [secure-admin-password-card]
    paths:
      - '.github/workflows/run-secure-admin-password-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: secure-admin-password-card
          fetch-depth: 0
      - name: Patch existing admin card only
        run: python .github/scripts/patch_secure_admin_password_card.py
      - name: Guard diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index.html" || { echo "Unexpected changed files: $changed"; exit 1; }
          if git diff -- index.html | grep -E '^[+-].*(ticker|rota-pending-poster|scheduleMatrixContainer|rotasticOpeningSplash)'; then
            echo 'Protected UI area changed'
            exit 1
          fi
      - name: Commit guarded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add secure unified access code card'
          git push origin HEAD:secure-admin-password-card
