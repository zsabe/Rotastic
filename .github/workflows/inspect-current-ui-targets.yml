name: Inspect current UI targets
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact current fragments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['topActionGrid','refreshLiveRota','rotasticLiveMini','driveTimeBtn','weatherBadge','personal-poster-card','topExportCard','topExportBtn']
          out=[]
          for n in needles:
              pos=[]; start=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  pos.append(i); start=i+1
              out.append(f'\n===== {n} count={len(pos)} =====\n')
              for j,i in enumerate(pos[:4],1):
                  out.append(f'--- {j} @ {i} ---\n{s[max(0,i-1800):min(len(s),i+3500)]}\n')
          Path('current-ui-targets.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-ui-targets.txt
          git commit -m "Write current UI target fragments"
          git pull --rebase origin main
          git push origin HEAD:main
