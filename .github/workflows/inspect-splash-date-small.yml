name: Inspect ROTASTIC splash date small

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-splash-date-small.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only splash date code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          lines=s.splitlines()
          patterns=[r'splash',r'Today is',r'today is',r'January',r'getQatarTodayISO',r'Intl\.DateTimeFormat',r'toLocaleDateString',r'new Date\(']
          idx=set()
          for p in patterns:
            rx=re.compile(p,re.I)
            for i,l in enumerate(lines):
              if rx.search(l):
                for j in range(max(0,i-3),min(len(lines),i+6)): idx.add(j)
          out=[]
          for j in sorted(idx): out.append(f'{j+1}: {lines[j]}')
          Path('splash-date-small.txt').write_text('\n'.join(out[:1000]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add splash-date-small.txt
          git commit -m 'Add focused splash date inspection'
          git push
