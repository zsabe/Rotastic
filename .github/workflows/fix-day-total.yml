name: Fix ROTASTIC day total

on:
  push:
    paths:
      - '.github/workflows/fix-day-total.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch day total calculation in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """function getDayDisplayedLeaveCount(day) {
            return getDisplayedLeaveDoctorsForDay(day).length;
          }"""

          new = """function getDayDisplayedLeaveCount(day) {
            if (!day) return 0;

            // Count unique doctors on leave for the whole day from every authoritative
            // leave source already used by the rota, not only the visible day.leaves array.
            const found = new Set(
              getDisplayedLeaveDoctorsForDay(day)
                .map(canonicalRotaName)
                .filter(Boolean)
            );

            (Array.isArray(DOCTORS) ? DOCTORS : []).forEach(function(item) {
              const doctor = canonicalRotaName(item && item.name);
              if (doctor && doctorIsOnLeaveForDay(doctor, day)) found.add(doctor);
            });

            return found.size;
          }"""

          if old not in text:
              raise SystemExit('Expected getDayDisplayedLeaveCount function was not found; refusing to change index.html.')

          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('No change made.')

          path.write_text(updated, encoding='utf-8')

      - name: Commit patched HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix day leave total calculation"
          git push origin HEAD:main
