name: Apply Live Tools Layout Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Correct ETA and Weather live placement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct only ETA, Weather and Refresh controls
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit correction
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct ETA and Weather live placement"
          git push
