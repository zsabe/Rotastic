name: Apply Live Tools Layout Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Place ETA and Weather beside LIVE') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only ETA, Weather and Refresh controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'rotastic-live-inline-tools-patch'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          patch = r'''
<!-- rotastic-live-inline-tools-patch: only ETA/Weather/Refresh placement -->
<style id="rotastic-live-inline-tools-patch-style">
  #rotastic-live-inline-tools-patch-host {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 7px;
    vertical-align: middle;
    flex-wrap: nowrap;
  }
  #rotastic-live-inline-tools-patch-host .rotastic-live-mini-tool {
    width: auto !important;
    min-width: 0 !important;
    min-height: 0 !important;
    height: auto !important;
    margin: 0 !important;
    padding: 3px 7px !important;
    font-size: 11px !important;
    line-height: 1.15 !important;
    border-radius: 8px !important;
    flex: 0 0 auto !important;
  }
</style>
<script id="rotastic-live-inline-tools-patch">
(function () {
  'use strict';

  function textOf(el) {
    return (el && el.textContent ? el.textContent : '').replace(/\s+/g, ' ').trim();
  }

  function exactControl(label) {
    var selectors = 'button, a, [role="button"], .quick-action, .action-card, .action-btn, .tool-card, .menu-card';
    var nodes = document.querySelectorAll(selectors);
    for (var i = 0; i < nodes.length; i++) {
      if (textOf(nodes[i]).toLowerCase() === label.toLowerCase()) return nodes[i];
    }
    return null;
  }

  function exactLeaf(label) {
    var all = document.querySelectorAll('span, div, strong, b, small, p');
    var wanted = label.toLowerCase();
    for (var i = 0; i < all.length; i++) {
      if (textOf(all[i]).toLowerCase() !== wanted) continue;
      var children = all[i].children;
      var childSame = false;
      for (var j = 0; j < children.length; j++) {
        if (textOf(children[j]).toLowerCase() === wanted) { childSame = true; break; }
      }
      if (!childSame) return all[i];
    }
    return null;
  }

  function hideEmptySource(sourceParent) {
    if (!sourceParent || sourceParent.id === 'rotastic-live-inline-tools-patch-host') return;
    var remaining = textOf(sourceParent);
    if (!remaining || remaining.toLowerCase() === 'eta' || remaining.toLowerCase() === 'weather') {
      sourceParent.style.display = 'none';
      sourceParent.setAttribute('data-rotastic-live-tool-source', 'hidden');
    }
  }

  function placeMiniTool(label, host) {
    var control = exactControl(label);
    if (!control || host.contains(control)) return;
    var oldParent = control.parentElement;
    control.classList.add('rotastic-live-mini-tool');
    host.appendChild(control);
    hideEmptySource(oldParent);
  }

  function apply() {
    var live = exactLeaf('LIVE') || exactLeaf('Live');
    if (!live || !live.parentElement) return;

    var host = document.getElementById('rotastic-live-inline-tools-patch-host');
    if (!host) {
      host = document.createElement('span');
      host.id = 'rotastic-live-inline-tools-patch-host';
      live.insertAdjacentElement('afterend', host);
    }

    placeMiniTool('ETA', host);
    placeMiniTool('Weather', host);

    var refresh = exactControl('Refresh');
    if (refresh) refresh.style.display = 'none';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', apply, { once: true });
  } else {
    apply();
  }

  var attempts = 0;
  var timer = setInterval(function () {
    apply();
    attempts += 1;
    if (attempts >= 30) clearInterval(timer);
  }, 400);
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('Could not find </body>; refusing to modify index.html')
          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place ETA and Weather beside LIVE"
          git push
