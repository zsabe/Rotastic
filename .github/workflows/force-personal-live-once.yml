name: Force personal LIVE once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final status strip
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          extra='''\n<style id="rotastic-personal-live-guarantee">\n.live-rota-meta-row{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;align-items:center!important}\n.live-rota-meta-row::before{content:"● LIVE";grid-column:1!important;grid-row:1!important;justify-self:start!important;align-self:center!important;color:#f43f5e!important;font-size:10px!important;line-height:20px!important;font-weight:700!important;letter-spacing:.02em!important;white-space:nowrap!important}\n.live-rota-meta-row>.rotastic-live-mini{display:none!important}\n.live-rota-meta-row>.live-drive-slot{grid-column:2!important;grid-row:1!important;justify-self:center!important}\n.live-rota-meta-row>#weatherBadge{grid-column:3!important;grid-row:1!important;justify-self:end!important}\n</style>\n'''
          if 'id="rotastic-personal-live-guarantee"' not in s:
              s=s.replace('</body>', extra+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Guarantee LIVE label in personal view" || exit 0
          git push
